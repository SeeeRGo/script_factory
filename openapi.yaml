openapi: 3.0.3
info:
  title: Script Factory API
  version: 0.1.0
servers:
  - url: http://localhost:3000/api/v2
    description: Local development server
  - url: /api/v2
    description: Relative path for same-origin deployment
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
  schemas:
    RetryPolicy:
      type: object
      properties:
        max_attempts:
          type: integer
          minimum: 1
          example: 2
        backoff_ms:
          type: integer
          minimum: 0
          example: 500
    ScriptStep:
      type: object
      required: [action]
      properties:
        id:
          type: string
          example: locate-reports
        action:
          type: string
          enum: [noop, check_ip, launch_browser, navigate, auth_ecp, find_files, upload_files, validate_report, submit_if_valid, move_files]
          example: find_files
        params:
          type: object
          additionalProperties: true
          description: Action parameters. Values may contain context templates such as `{{root_dir}}` or `{{found_files}}`.
        timeout_ms:
          type: integer
          minimum: 1
          description: Maximum execution time for this step.
          example: 5000
        duration_ms:
          type: number
          minimum: 0
          description: Mock action duration used by the Stage 2 adapter.
          example: 250
    JsonScript:
      type: object
      required: [steps]
      properties:
        context:
          type: object
          additionalProperties: true
          description: Script-local initial context.
        default_step_timeout_ms:
          type: integer
          minimum: 1
          example: 10000
        steps:
          type: array
          items:
            $ref: '#/components/schemas/ScriptStep'
    JobCreateRequest:
      type: object
      properties:
        uid:
          type: string
          description: Optional idempotency identifier. Idempotency-Key is also supported.
        priority:
          type: integer
          description: Lower value means higher priority.
          example: 100
        timeout_ms:
          type: integer
          description: Per-job timeout in milliseconds.
          example: 30000
        retry_policy:
          $ref: '#/components/schemas/RetryPolicy'
        context:
          type: object
          additionalProperties: true
          description: Initial interpreter context. Overrides matching script context values.
        script:
          $ref: '#/components/schemas/JsonScript'
    ExecutionStep:
      type: object
      properties:
        index:
          type: integer
        id:
          type: string
        action:
          type: string
        status:
          type: string
          enum: [pending, running, success, failed]
        attempt:
          type: integer
          nullable: true
        started_at:
          type: string
          format: date-time
          nullable: true
        finished_at:
          type: string
          format: date-time
          nullable: true
        duration_ms:
          type: integer
          nullable: true
        params:
          type: object
          nullable: true
          additionalProperties: true
        output:
          type: object
          nullable: true
          additionalProperties: true
        error:
          $ref: '#/components/schemas/ErrorBody'
    Execution:
      type: object
      properties:
        status:
          type: string
        total_steps:
          type: integer
        completed_steps:
          type: integer
        current_step:
          type: integer
          nullable: true
        percent:
          type: integer
          minimum: 0
          maximum: 100
        duration_ms:
          type: integer
          nullable: true
        context:
          type: object
          nullable: true
          additionalProperties: true
        steps:
          type: array
          items:
            $ref: '#/components/schemas/ExecutionStep'
    ErrorBody:
      type: object
      nullable: true
      properties:
        code:
          type: string
          example: VALIDATION_ERROR
        message:
          type: string
        details:
          type: object
          additionalProperties: true
    Job:
      type: object
      properties:
        job_id:
          type: string
        uid:
          type: string
        status:
          type: string
          enum: [queued, running, retrying, success, failed, validation_failed, cancelled, timeout]
        priority:
          type: integer
        attempts:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
          nullable: true
        finished_at:
          type: string
          format: date-time
          nullable: true
        result:
          type: object
          nullable: true
          additionalProperties: true
        error:
          $ref: '#/components/schemas/ErrorBody'
        execution:
          $ref: '#/components/schemas/Execution'
    JobResponse:
      type: object
      properties:
        job:
          $ref: '#/components/schemas/Job'
        idempotent:
          type: boolean
    JobLog:
      type: object
      properties:
        ts:
          type: string
          format: date-time
        level:
          type: string
          enum: [debug, info, warn, error]
        message:
          type: string
        details:
          type: object
          additionalProperties: true
    SystemConfig:
      type: object
      properties:
        max_parallel_jobs:
          type: integer
          example: 1
        default_job_timeout_ms:
          type: integer
          example: 30000
        retry_policy:
          $ref: '#/components/schemas/RetryPolicy'
security:
  - ApiKeyAuth: []
paths:
  /health:
    get:
      summary: Health check
      security: []
      responses:
        "200":
          description: OK
  /interpreter/actions:
    get:
      summary: List registered interpreter actions
      responses:
        "200":
          description: Registered action names
          content:
            application/json:
              schema:
                type: object
                properties:
                  actions:
                    type: array
                    items:
                      type: string
  /jobs:
    get:
      summary: List jobs
      parameters:
        - in: query
          name: status
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
      responses:
        "200":
          description: Job collection
    post:
      summary: Create job
      parameters:
        - in: header
          name: Idempotency-Key
          required: false
          schema:
            type: string
          description: Optional idempotency key for retry-safe job creation.
          example: job-2026-06-08-001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobCreateRequest'
            example:
              priority: 100
              timeout_ms: 30000
              retry_policy:
                max_attempts: 2
                backoff_ms: 500
              context:
                root_dir: /reports/incoming
                loaded_dir: /reports/loaded
              script:
                steps:
                  - action: find_files
                    params:
                      directory: "{{root_dir}}"
                      files: [FNS_2026.xml]
                  - action: upload_files
                    params:
                      files: "{{found_files}}"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobResponse'
        "400":
          description: Invalid job or script contract
  /jobs/{job_id}:
    get:
      summary: Get job
      parameters:
        - in: path
          name: job_id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Job
          content:
            application/json:
              schema:
                type: object
                properties:
                  job:
                    $ref: '#/components/schemas/Job'
  /jobs/{job_id}/cancel:
    post:
      summary: Cancel job
      parameters:
        - in: path
          name: job_id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Cancelled
  /jobs/{job_id}/logs:
    get:
      summary: Get job logs
      parameters:
        - in: path
          name: job_id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Logs
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_id:
                    type: string
                  logs:
                    type: array
                    items:
                      $ref: '#/components/schemas/JobLog'
  /system/resources:
    get:
      summary: Get system resources
      responses:
        "200":
          description: Resources
  /system/config:
    get:
      summary: Get config
      responses:
        "200":
          description: Config
    put:
      summary: Update config
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SystemConfig'
            example:
              max_parallel_jobs: 2
              default_job_timeout_ms: 30000
              retry_policy:
                max_attempts: 2
                backoff_ms: 500
      responses:
        "200":
          description: Config
