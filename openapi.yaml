openapi: 3.0.3
info:
  title: API «Фабрика сценариев»
  description: Управление очередью и выполнением JSON-сценариев.
  version: 0.1.0
servers:
  - url: http://localhost:3000/api/v2
    description: Локальный сервер разработки
  - url: /api/v2
    description: Относительный путь для развёртывания на том же домене
tags:
  - name: Сервис
    description: Состояние сервиса
  - name: Интерпретатор
    description: Возможности интерпретатора JSON-шагов
  - name: Задания
    description: Управление заданиями и их выполнением
  - name: Система
    description: Ресурсы и настройки системы
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
  schemas:
    RetryPolicy:
      type: object
      properties:
        max_attempts:
          type: integer
          minimum: 1
          example: 2
        backoff_ms:
          type: integer
          minimum: 0
          example: 500
    ScriptStep:
      type: object
      required: [action]
      properties:
        id:
          type: string
          example: locate-reports
        action:
          type: string
          enum: [noop, check_ip, launch_browser, navigate, auth_ecp, find_files, upload_files, validate_report, submit_if_valid, move_files]
          example: find_files
        params:
          type: object
          additionalProperties: true
          description: Параметры действия. Поддерживаются шаблоны контекста `{{root_dir}}` и `{{found_files}}`.
        timeout_ms:
          type: integer
          minimum: 1
          description: Максимальное время выполнения шага.
          example: 5000
        duration_ms:
          type: number
          minimum: 0
          description: Длительность тестового действия для демо этапа 2.
          example: 250
    JsonScript:
      type: object
      required: [steps]
      properties:
        context:
          type: object
          additionalProperties: true
          description: Начальный контекст сценария.
        default_step_timeout_ms:
          type: integer
          minimum: 1
          example: 10000
        steps:
          type: array
          items:
            $ref: '#/components/schemas/ScriptStep'
    JobCreateRequest:
      type: object
      properties:
        uid:
          type: string
          description: Необязательный идентификатор идемпотентности. Также поддерживается Idempotency-Key.
        priority:
          type: integer
          description: Чем меньше значение, тем выше приоритет.
          example: 100
        timeout_ms:
          type: integer
          description: Тайм-аут задания в миллисекундах.
          example: 30000
        retry_policy:
          $ref: '#/components/schemas/RetryPolicy'
        context:
          type: object
          additionalProperties: true
          description: Начальный контекст интерпретатора, переопределяющий одноимённые значения сценария.
        script:
          $ref: '#/components/schemas/JsonScript'
    ExecutionStep:
      type: object
      properties:
        index:
          type: integer
        id:
          type: string
        action:
          type: string
        status:
          type: string
          enum: [pending, running, success, failed]
        attempt:
          type: integer
          nullable: true
        started_at:
          type: string
          format: date-time
          nullable: true
        finished_at:
          type: string
          format: date-time
          nullable: true
        duration_ms:
          type: integer
          nullable: true
        params:
          type: object
          nullable: true
          additionalProperties: true
        output:
          type: object
          nullable: true
          additionalProperties: true
        error:
          $ref: '#/components/schemas/ErrorBody'
    Execution:
      type: object
      properties:
        status:
          type: string
        total_steps:
          type: integer
        completed_steps:
          type: integer
        current_step:
          type: integer
          nullable: true
        percent:
          type: integer
          minimum: 0
          maximum: 100
        duration_ms:
          type: integer
          nullable: true
        context:
          type: object
          nullable: true
          additionalProperties: true
        steps:
          type: array
          items:
            $ref: '#/components/schemas/ExecutionStep'
    ErrorBody:
      type: object
      nullable: true
      properties:
        code:
          type: string
          example: VALIDATION_ERROR
        message:
          type: string
        details:
          type: object
          additionalProperties: true
    Job:
      type: object
      properties:
        job_id:
          type: string
        uid:
          type: string
        status:
          type: string
          enum: [queued, running, retrying, success, failed, validation_failed, cancelled, timeout]
        priority:
          type: integer
        attempts:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
          nullable: true
        finished_at:
          type: string
          format: date-time
          nullable: true
        result:
          type: object
          nullable: true
          additionalProperties: true
        error:
          $ref: '#/components/schemas/ErrorBody'
        execution:
          $ref: '#/components/schemas/Execution'
    JobResponse:
      type: object
      properties:
        job:
          $ref: '#/components/schemas/Job'
        idempotent:
          type: boolean
    JobLog:
      type: object
      properties:
        ts:
          type: string
          format: date-time
        level:
          type: string
          enum: [debug, info, warn, error]
        message:
          type: string
        details:
          type: object
          additionalProperties: true
    SystemConfig:
      type: object
      properties:
        max_parallel_jobs:
          type: integer
          example: 1
        default_job_timeout_ms:
          type: integer
          example: 30000
        retry_policy:
          $ref: '#/components/schemas/RetryPolicy'
security:
  - ApiKeyAuth: []
paths:
  /health:
    get:
      tags: [Сервис]
      summary: Проверить состояние сервиса
      security: []
      responses:
        "200":
          description: Сервис доступен
  /interpreter/actions:
    get:
      tags: [Интерпретатор]
      summary: Получить зарегистрированные действия
      responses:
        "200":
          description: Названия зарегистрированных действий
          content:
            application/json:
              schema:
                type: object
                properties:
                  actions:
                    type: array
                    items:
                      type: string
  /jobs:
    get:
      tags: [Задания]
      summary: Получить список заданий
      parameters:
        - in: query
          name: status
          description: Фильтр по статусу задания.
          schema:
            type: string
        - in: query
          name: limit
          description: Максимальное количество заданий в ответе.
          schema:
            type: integer
      responses:
        "200":
          description: Список заданий
    post:
      tags: [Задания]
      summary: Создать задание
      parameters:
        - in: header
          name: Idempotency-Key
          required: false
          schema:
            type: string
          description: Необязательный ключ идемпотентности для безопасного повторного создания задания.
          example: job-2026-06-08-001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobCreateRequest'
            example:
              priority: 100
              timeout_ms: 30000
              retry_policy:
                max_attempts: 2
                backoff_ms: 500
              context:
                root_dir: /reports/incoming
                loaded_dir: /reports/loaded
              script:
                steps:
                  - action: find_files
                    params:
                      directory: "{{root_dir}}"
                      files: [FNS_2026.xml]
                  - action: upload_files
                    params:
                      files: "{{found_files}}"
      responses:
        "201":
          description: Задание создано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobResponse'
        "400":
          description: Некорректный контракт задания или сценария
  /jobs/{job_id}:
    get:
      tags: [Задания]
      summary: Получить задание
      parameters:
        - in: path
          name: job_id
          description: Идентификатор задания.
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Задание
          content:
            application/json:
              schema:
                type: object
                properties:
                  job:
                    $ref: '#/components/schemas/Job'
  /jobs/{job_id}/cancel:
    post:
      tags: [Задания]
      summary: Отменить задание
      parameters:
        - in: path
          name: job_id
          description: Идентификатор задания.
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Задание отменено
  /jobs/{job_id}/logs:
    get:
      tags: [Задания]
      summary: Получить журнал задания
      parameters:
        - in: path
          name: job_id
          description: Идентификатор задания.
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Журнал задания
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_id:
                    type: string
                  logs:
                    type: array
                    items:
                      $ref: '#/components/schemas/JobLog'
  /system/resources:
    get:
      tags: [Система]
      summary: Получить сведения о ресурсах системы
      responses:
        "200":
          description: Ресурсы системы
  /system/config:
    get:
      tags: [Система]
      summary: Получить настройки
      responses:
        "200":
          description: Настройки
    put:
      tags: [Система]
      summary: Обновить настройки
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SystemConfig'
            example:
              max_parallel_jobs: 2
              default_job_timeout_ms: 30000
              retry_policy:
                max_attempts: 2
                backoff_ms: 500
      responses:
        "200":
          description: Обновлённые настройки
