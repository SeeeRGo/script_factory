openapi: 3.0.3
info:
  title: API «Фабрика сценариев»
  description: API этапа 4 для интеграции 1С с очередью УН, получения статуса, результата и гарантируемого callback, включая JSON Steps и записи Chrome Recorder через Puppeteer Replay.
  version: 0.13.2
servers:
  - url: http://TEST_UN_HOST:33001/api/v2
    description: Тестовая УН Windows (заменить TEST_UN_HOST на имя или IP машины)
  - url: http://localhost:33001/api/v2
    description: API в Docker Compose
  - url: /api/v2
    description: Относительный путь для развёртывания на том же домене
tags:
  - name: Сервис
    description: Состояние сервиса
  - name: Интерпретатор
    description: Возможности интерпретатора JSON-шагов
  - name: Задания
    description: Управление заданиями и их выполнением
  - name: Система
    description: Ресурсы и настройки системы
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
  schemas:
    PowerConfig:
      type: object
      additionalProperties: false
      properties:
        enabled: {type: boolean, default: false}
        background_enabled: {type: boolean, default: false}
        dry_run: {type: boolean, default: true}
        mode: {type: string, enum: [sleep, hibernate, shutdown], default: sleep, description: 'Явный режим Windows: сон, гибернация или завершение работы; автоматической подмены нет.'}
        excluded_user: {type: string, nullable: true, minLength: 1, maxLength: 256, description: 'Исключаемая Windows-учётная запись; null в PATCH сбрасывает переопределение к .env/WORKER_ACCOUNT в broker, пользователю API в inline. Сопоставляется по SID.'}
        user_idle_seconds: {type: integer, minimum: 1, maximum: 2592000, default: 1800}
        check_interval_seconds: {type: integer, minimum: 5, maximum: 86400, default: 60}
        grace_seconds: {type: integer, minimum: 0, maximum: 3600, default: 30}
        resume_cooldown_seconds: {type: integer, minimum: 1, maximum: 86400, default: 300}

    RetryPolicy:
      type: object
      properties:
        max_attempts:
          type: integer
          minimum: 1
          example: 2
        backoff_ms:
          type: integer
          minimum: 0
          example: 500
    ScriptStep:
      type: object
      required: [action]
      properties:
        id:
          type: string
          example: locate-reports
        title:
          type: string
          description: Короткое человекочитаемое название шага.
        description:
          type: string
          description: Объяснение действия и ожидаемого результата шага.
        action:
          type: string
          enum: [noop, wait, check_ip, launch_browser, navigate, auth_ecp, find_files, upload_files, download_files, validate_report, submit_if_valid, move_files, copy_files, read_text_file, write_text_file, open_file, delete_files]
          example: find_files
        params:
          type: object
          additionalProperties: true
          description: Параметры действия. Поддерживаются шаблоны контекста `{{root_dir}}` и `{{found_files}}`.
        timeout_ms:
          type: integer
          minimum: 1
          description: Максимальное время выполнения шага.
          example: 5000
        duration_ms:
          type: number
          minimum: 0
          description: Длительность действия; для явного ожидания используйте action=wait и params.duration_ms.
          example: 250
        delay_ms:
          type: number
          minimum: 0
          description: Альтернативное имя искусственной задержки для демонстрационных сценариев.
          example: 250
    JsonScript:
      type: object
      description: Обратно совместимый сценарий внутренних JSON Steps этапа 2; демонстрационные действия не используются исполнителем json-workflow.
      required: [steps]
      properties:
        format:
          type: string
          enum: [json-steps]
        context:
          type: object
          additionalProperties: true
          description: Начальный контекст сценария.
        default_step_timeout_ms:
          type: integer
          minimum: 1
          example: 10000
        inter_step_delay_ms:
          type: integer
          minimum: 0
          default: 0
          description: Пауза между успешными шагами в миллисекундах; 0 отключает задержки.
          example: 10000
        steps:
          type: array
          items:
            $ref: '#/components/schemas/ScriptStep'
    ReplayStep:
      type: object
      required: [type]
      description: Шаг Chrome DevTools Recorder; также поддерживается customStep с name=uploadFiles и parameters.selector/files для загрузки файлов из разрешённых каталогов УН.
      properties:
        type:
          type: string
          enum: [setViewport, navigate, click, doubleClick, change, hover, scroll, keyDown, keyUp, waitForElement, waitForExpression, emulateNetworkConditions, close, customStep]
        timeout:
          type: integer
          minimum: 1
          maximum: 2147483647
        selectors:
          type: array
          description: Альтернативные CSS, ARIA, text, XPath или pierce-селекторы Recorder.
          items: {}
      additionalProperties: true
    PuppeteerReplayScript:
      type: object
      required: [title, steps]
      description: Нативный JSON, экспортированный через Chrome DevTools Recorder → Export → JSON.
      properties:
        browser:
          $ref: '#/components/schemas/BrowserSettings'
        title:
          type: string
        timeout:
          type: integer
          minimum: 1
          maximum: 2147483647
        selectorAttribute:
          type: string
        steps:
          type: array
          items:
            $ref: '#/components/schemas/ReplayStep'
    WorkflowStep:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [try, set, compute, assert, fail, if, for_each, call, wait, system_ip_check, directory_create, files_list, file_verify, file_archive, file_copy, file_read, artifact_write, browser_launch, browser_tab, browser_steps, browser_eval, browser_wait, browser_screenshot]
        title:
          type: string
        description:
          type: string
        params:
          type: object
          additionalProperties: true
          description: Параметры универсальной операции; шаблоны {{variable}} берутся из context.
        save_as:
          type: string
          description: Имя переменной для результата операции.
        private:
          type: boolean
          description: Скрывает параметры и результат шага в журнале выполнения.
        timeout_ms:
          oneOf:
            - type: integer
              minimum: 1
            - type: string
              pattern: '^\{\{\s*[\w.]+\s*\}\}$'
        error_as:
          type: string
          description: Имя переменной ошибки в catch.
        error_codes:
          type: array
          items: {type: string}
        catch:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowStep'
        as:
          type: string
          description: Переменная элемента for_each.
        index_as:
          type: string
        routine:
          type: string
          description: Имя подпрограммы из routines для call.
        steps:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowStep'
        then:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowStep'
        else:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowStep'
    JsonWorkflowScript:
      type: object
      required: [format, steps]
      description: Универсальный сценарий. Циклы, условия, проверки, выражения и браузерные шаги определены в JSON; обработчиков отдельных сайтов нет. Пример demo/sbis-report-full.json.
      properties:
        browser:
          $ref: '#/components/schemas/BrowserSettings'
        limits:
          $ref: '#/components/schemas/WorkflowLimits'
        format:
          type: string
          enum: [json-workflow]
        title:
          type: string
        context:
          type: object
          additionalProperties: true
        default_step_timeout_ms:
          type: integer
          minimum: 1
        routines:
          type: object
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/WorkflowStep'
        steps:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowStep'
        on_error:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowStep'
        output:
          type: object
          additionalProperties: true
          description: Проекция итогового контекста, например Rezult_1; внутренние переменные не возвращаются.
    BrowserSettings:
      type: object
      additionalProperties: false
      description: Общие настройки браузера API 0.9.15+. Подробности docs/project-guide/10-browser-settings.md.
      properties:
        headless:
          type: boolean
          default: true
        launch_timeout_ms:
          type: integer
          minimum: 1
          maximum: 2147483647
          default: 30000
        protocol_timeout_ms:
          type: integer
          minimum: 1
          maximum: 2147483647
          default: 180000
        default_timeout_ms:
          type: integer
          minimum: 1
          maximum: 2147483647
          default: 30000
        navigation_timeout_ms:
          type: integer
          minimum: 1
          maximum: 2147483647
          default: 30000
        window_width:
          type: integer
          minimum: 1
          maximum: 2147483647
          default: 1400
        window_height:
          type: integer
          minimum: 1
          maximum: 2147483647
          default: 860
        viewport:
          nullable: true
          oneOf:
            - {type: string, enum: [auto]}
            - {type: object, additionalProperties: true}
          default: auto
        user_data_dir:
          type: string
          nullable: true
        profile_directory:
          type: string
          nullable: true
        executable_path:
          type: string
          nullable: true
        args:
          type: array
          items: {type: string}
        ignore_default_args:
          oneOf:
            - {type: boolean}
            - {type: array, items: {type: string}}
          default: false
        enable_extensions:
          type: boolean
          default: false
        extensions:
          type: array
          items: {type: string}
        proxy_server:
          type: string
          nullable: true
        proxy_bypass_list:
          type: string
          nullable: true
        proxy_username:
          type: string
          nullable: true
        proxy_password:
          type: string
          nullable: true
          writeOnly: true
        user_agent:
          type: string
          nullable: true
        locale:
          type: string
          nullable: true
        timezone_id:
          type: string
          nullable: true
        extra_http_headers:
          type: object
          additionalProperties: {type: string}
        accept_insecure_certs:
          type: boolean
          default: false
        slow_mo_ms:
          type: integer
          minimum: 0
          maximum: 2147483647
          default: 0
        step_delay_ms:
          type: integer
          minimum: 0
          maximum: 2147483647
          default: 0
        hold_open_ms:
          type: integer
          minimum: 0
          maximum: 2147483647
          default: 0
        captcha_wait_ms:
          type: integer
          minimum: 0
          maximum: 2147483647
          default: 0
        captcha_poll_ms:
          type: integer
          minimum: 1
          maximum: 2147483647
          default: 500
        download_dir:
          type: string
          nullable: true
        download_behavior:
          type: string
          default: "default"
        dialog_action:
          type: string
          default: "dismiss"
        dialog_prompt_text:
          type: string
          default: ""
        permissions:
          type: array
          items:
            type: object
            required: [origin, permissions]
            properties:
              origin: {type: string}
              permissions: {type: array, items: {type: string}}
    WorkflowLimits:
      type: object
      additionalProperties: false
      description: Лимиты json-workflow, API 0.9.15+.
      properties:
        max_steps:
          type: integer
          minimum: 1
          default: 10000
        max_iterations:
          type: integer
          minimum: 1
          default: 1000
        max_depth:
          type: integer
          minimum: 1
          default: 25
        compute_timeout_ms:
          type: integer
          minimum: 1
          default: 1000
        max_expression_chars:
          type: integer
          minimum: 1
          default: 100000
        max_context_bytes:
          type: integer
          minimum: 1
          default: 16777216
        max_result_bytes:
          type: integer
          minimum: 1
          default: 16777216
        compute_memory_mb:
          type: integer
          minimum: 16
          default: 64
    AnyScript:
      oneOf:
        - $ref: '#/components/schemas/PuppeteerReplayScript'
        - $ref: '#/components/schemas/JsonScript'
        - $ref: '#/components/schemas/JsonWorkflowScript'
    CallbackConfig:
      type: object
      required: [url]
      description: Доставка финального результата в HTTP-сервис 1С. Авторизация задаётся на УН парой CALLBACK_AUTH_USERNAME/CALLBACK_AUTH_PASSWORD (HTTP Basic).
      properties:
        url:
          type: string
          format: uri
          description: Полный HTTP или HTTPS адрес обработчика 1С. Протокол выбирает клиент; origin должен соответствовать CALLBACK_ALLOWED_ORIGINS, если список задан.
          example: http://1c-test.local/script-factory/result
        max_attempts:
          type: integer
          minimum: 1
          maximum: 20
          default: 5
        backoff_ms:
          type: integer
          minimum: 0
          maximum: 60000
          default: 1000
        timeout_ms:
          type: integer
          minimum: 1
          maximum: 60000
          default: 5000
    JobCreateRequest:
      type: object
      description: Поддерживает прежний плоский формат и новый формат с parameters + script_text. Смешивать параметры верхнего уровня с parameters нельзя.
      properties:
        parameters:
          $ref: '#/components/schemas/JobParameters'
        script_text:
          type: string
          description: Сценарий как сериализованный JSON-объект. Передаётся отдельно от parameters.
        uid:
          type: string
          description: Идентификатор задания во внешней системе и ключ идемпотентности. Также поддерживается Idempotency-Key.
        priority:
          type: integer
          description: Чем меньше значение, тем выше приоритет.
          example: 100
        timeout_ms:
          type: integer
          description: Тайм-аут задания в миллисекундах.
          example: 30000
        retry_policy:
          $ref: '#/components/schemas/RetryPolicy'
        callback:
          $ref: '#/components/schemas/CallbackConfig'
        context:
          type: object
          additionalProperties: true
          description: Начальный контекст интерпретатора, переопределяющий одноимённые значения сценария.
        log_level:
          $ref: '#/components/schemas/LogLevel'
        script:
          $ref: '#/components/schemas/AnyScript'
    JobParameters:
      type: object
      description: Параметры постановки задания в новом разделённом формате.
      properties:
        uid:
          type: string
          description: Внешний идентификатор заявки и ключ идемпотентности.
        priority:
          type: integer
          description: Чем меньше значение, тем выше приоритет.
        timeout_ms:
          type: integer
          minimum: 1
        retry_policy:
          $ref: '#/components/schemas/RetryPolicy'
        callback:
          $ref: '#/components/schemas/CallbackConfig'
        context:
          type: object
          additionalProperties: true
        log_level:
          $ref: '#/components/schemas/LogLevel'
    LogLevel:
      type: string
      enum: [debug, info, warn, error]
      default: info
    ExecutionStep:
      type: object
      properties:
        source_path:
          type: string
          nullable: true
          description: Путь к исходному шагу JSON workflow, например routines.identity[0]; API 0.9.3+.
        index:
          type: integer
        id:
          type: string
        action:
          type: string
          description: action для JSON Steps или type для Puppeteer Replay.
        title:
          type: string
          nullable: true
          description: Короткое человекочитаемое название шага.
        description:
          type: string
          nullable: true
          description: Объяснение действия и ожидаемого результата шага.
        status:
          type: string
          enum: [pending, running, success, failed]
        attempt:
          type: integer
          nullable: true
        started_at:
          type: string
          format: date-time
          nullable: true
        finished_at:
          type: string
          format: date-time
          nullable: true
        duration_ms:
          type: integer
          nullable: true
        params:
          type: object
          nullable: true
          additionalProperties: true
        output:
          type: object
          nullable: true
          additionalProperties: true
        error:
          $ref: '#/components/schemas/ErrorBody'
    Execution:
      type: object
      properties:
        status:
          type: string
        total_steps:
          type: integer
        completed_steps:
          type: integer
        current_step:
          type: integer
          nullable: true
        percent:
          type: integer
          minimum: 0
          maximum: 100
        duration_ms:
          type: integer
          nullable: true
        context:
          type: object
          nullable: true
          additionalProperties: true
        steps:
          type: array
          items:
            $ref: '#/components/schemas/ExecutionStep'
    ErrorBody:
      type: object
      nullable: true
      properties:
        code:
          type: string
          example: VALIDATION_ERROR
        message:
          type: string
          description: В API 0.9.3 ошибка именованного шага JSON workflow содержит префикс «Шаг …» и исходную причину; код ошибки сохраняется.
        retryable:
          type: boolean
        step_index:
          type: integer
          description: Динамический номер выполнения шага, начиная с 1.
        step_id:
          type: string
          description: ID исходного шага JSON workflow; API 0.9.3+.
        source_path:
          type: string
          description: Путь к исходному шагу JSON workflow; API 0.9.3+.
        action:
          type: string
        details:
          type: object
          additionalProperties: true
    Artifact:
      type: object
      required: [artifact_id, kind, filename, local_path]
      properties:
        artifact_id:
          type: string
          description: Стабильный идентификатор артефакта в рамках результата задания.
        kind:
          type: string
          enum: [downloaded_file, browser_screenshot]
        filename:
          type: string
        local_path:
          type: string
          description: Путь к файлу на УН, выполнившей задание.
        source_url:
          type: string
          format: uri
          nullable: true
        public_url:
          type: string
          nullable: true
          description: Защищённая ссылка интерфейса на артефакт, если он доступен для просмотра.
        api_url:
          type: string
          description: Относительный API-адрес скачивания с заголовком X-API-Key.
        mime_type:
          type: string
          nullable: true
        size_bytes:
          type: integer
          minimum: 0
          nullable: true
        checksum_sha256:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
    JobResult:
      type: object
      nullable: true
      description: >-
        Итог выполнения. artifacts содержит объекты filename и api_url всех сохранённых файлов
        без привязки к результатам; Rezult_N — произвольные по составу поля
        для результата N, набор и количество зависят от сценария.
      required: [artifacts]
      properties:
        artifacts:
          type: array
          description: Имена и API-ссылки всех сохранённых файлов; пустой массив, если артефактов нет.
          items:
            type: object
            required: [filename, api_url]
            properties:
              filename:
                type: string
                nullable: true
                description: Имя с расширением; null только для старых результатов, сохранивших одну ссылку.
              api_url:
                type: string
                description: Относительная ссылка скачивания с X-API-Key.
      additionalProperties:
        type: object
        description: Значение Rezult_N — произвольный JSON-объект результата N.
        additionalProperties: true
    QueueHealth:
      type: object
      required: [status, queued, running, max_parallel_jobs, available_slots]
      properties:
        status:
          type: string
          enum: [idle, processing, busy]
        queued:
          type: integer
          minimum: 0
        running:
          type: integer
          minimum: 0
        max_parallel_jobs:
          type: integer
          minimum: 1
        available_slots:
          type: integer
          minimum: 0
    MaintenanceStatus:
      type: object
      required: [active, blockers, ready_to_update]
      properties:
        active: {type: boolean}
        owner: {type: string, description: Идентификатор операции, владеющей обслуживанием}
        reason: {type: string}
        phase: {type: string, enum: [draining, installing]}
        started_at: {type: string, format: date-time}
        blockers:
          type: array
          items: {type: string, enum: [JOBS_PENDING, CALLBACK_PENDING, ARTIFACT_TRANSFER, WORKER_EXECUTION_UNCERTAIN]}
        ready_to_update: {type: boolean}
    MaintenanceRequest:
      type: object
      additionalProperties: false
      required: [owner]
      properties:
        owner: {type: string, pattern: '^[A-Za-z0-9_-]{1,100}$'}
        reason: {type: string, maxLength: 200}
    WorkerStatus:
      type: object
      description: Состояние интерактивного исполнителя; API доступно независимо от входа пользователя.
      properties:
        mode: {type: string, enum: [inline, broker]}
        connected: {type: boolean}
        ready: {type: boolean}
        state: {type: string, enum: [READY, WAITING_FOR_SESSION, WORKER_STARTING, WORKER_SESSION_REQUIRED, WORKER_START_FAILED, WORKER_UNRESPONSIVE, WORKER_TRANSPORT_FAILED]}
        message: {type: string}
        retryable: {type: boolean, description: Повторять проверку до общего срока ожидания клиента}
        retry_after_ms: {type: integer, nullable: true}
        account: {type: string}
        session_id: {type: integer, nullable: true}
        pid: {type: integer, nullable: true}
        capacity: {type: integer}
        active: {type: integer}
        browser: {type: object, nullable: true, additionalProperties: true}
    HealthResponse:
      type: object
      required: [status, ready, service, version, release_date, request_id, un_id, checks, queue]
      properties:
        api_available: {type: boolean}
        execution_mode: {type: string, enum: [inline, broker]}
        worker:
          $ref: '#/components/schemas/WorkerStatus'
        maintenance:
          $ref: '#/components/schemas/MaintenanceStatus'
        status:
          type: string
          enum: [ok, error]
        ready:
          type: boolean
        service:
          type: string
        version:
          type: string
          example: 0.6.0
        release_date:
          type: string
          pattern: '^\d{2}\.\d{2}\.\d{4}$'
          example: '18.09.2026'
        request_id:
          type: string
        un_id:
          type: string
        checks:
          type: object
          additionalProperties:
            type: object
            properties:
              status:
                type: string
                enum: [ok, error]
              message:
                type: string
              path:
                type: string
              executable_path:
                type: string
                nullable: true
        error:
          $ref: '#/components/schemas/ErrorBody'
        queue:
          $ref: '#/components/schemas/QueueHealth'
        browser_replay:
          type: object
          properties:
            available:
              type: boolean
            engine:
              type: string
            browser_product:
              type: string
            executable_path:
              type: string
              nullable: true
            headless:
              type: boolean
            step_delay_ms:
              type: number
            live_view:
              type: object
              properties:
                enabled:
                  type: boolean
                port:
                  type: integer
                public_url:
                  type: string
                  nullable: true
                embedded_url:
                  type: string
                path:
                  type: string
    SystemResources:
      type: object
      description: Все вложенные поля имеют уникальные имена с префиксом структуры.
      properties:
        un_id:
          type: string
        api_version:
          type: string
          description: Версия API на УН.
          example: v2
        service_version:
          type: string
          description: Версия релиза службы.
        release_date:
          type: string
          description: Дата релиза службы в формате DD.MM.YYYY.
        uptime_seconds:
          type: integer
        cpu:
          type: object
          properties:
            cpu_logical_cores: { type: integer }
            cpu_system_percent: { type: number }
            cpu_process_percent: { type: number }
            cpu_load_average:
              type: array
              items: { type: number }
        memory:
          type: object
          properties:
            memory_total_bytes: { type: integer }
            memory_free_bytes: { type: integer }
            memory_used_percent: { type: number }
            memory_process_rss_bytes: { type: integer }
            memory_process_heap_used_bytes: { type: integer }
        disk:
          type: object
          nullable: true
          properties:
            disk_path: { type: string }
            disk_total_bytes: { type: integer }
            disk_free_bytes: { type: integer }
            disk_used_percent: { type: number }
        memory_usage:
          type: object
          properties:
            memory_usage_rss: { type: integer }
            memory_usage_heapTotal: { type: integer }
            memory_usage_heapUsed: { type: integer }
            memory_usage_external: { type: integer }
            memory_usage_arrayBuffers: { type: integer }
        jobs_total:
          type: integer
        jobs_running:
          type: integer
        jobs_queued:
          type: integer
        queue:
          type: object
          properties:
            queue_status: { type: string, enum: [idle, processing, busy] }
            queue_queued: { type: integer }
            queue_running: { type: integer }
            queue_max_parallel_jobs: { type: integer }
            queue_available_slots: { type: integer }
        browser_replay:
          type: object
          properties:
            browser_replay_available: { type: boolean }
            browser_replay_browser_product: { type: string }
            browser_replay_executable_path: { type: string, nullable: true }
            browser_replay_headless: { type: boolean }
            browser_replay_step_delay_ms: { type: number }
            browser_replay_captcha_wait_ms: { type: number }
            browser_replay_live_view_enabled: { type: boolean }
            browser_replay_demo_mail_messages: { type: integer }
        yandex_browser_version:
          type: string
          nullable: true
          description: Версия Яндекс Браузера или null, если определить не удалось.
        node_version:
          type: string
    Job:
      type: object
      properties:
        job_id:
          type: string
        uid:
          type: string
        log_level:
          $ref: '#/components/schemas/LogLevel'
        un_id:
          type: string
        status:
          type: string
          enum: [queued, running, retrying, success, failed, validation_failed, cancelled, timeout]
        priority:
          type: integer
        attempts:
          type: integer
        max_attempts:
          type: integer
        backoff_ms:
          type: integer
        timeout_ms:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
          nullable: true
        finished_at:
          type: string
          format: date-time
          nullable: true
        result:
          $ref: '#/components/schemas/JobResult'
        error:
          $ref: '#/components/schemas/ErrorBody'
        callback_delivery:
          type: object
          nullable: true
          description: Состояние асинхронной доставки финального результата в 1С.
          properties:
            status:
              type: string
              enum: [pending, delivering, retrying, delivered, failed]
            url: { type: string }
            attempts: { type: integer }
            max_attempts: { type: integer }
            last_http_status: { type: integer, nullable: true }
            last_response_at: { type: string, format: date-time, nullable: true }
            last_response_content_type: { type: string, nullable: true }
            last_response_body:
              type: string
              nullable: true
              description: Тело последнего HTTP-ответа callback, не более 16 КиБ.
            last_response_body_truncated:
              type: boolean
              description: Признак обрезки тела последнего ответа по ограничению 16 КиБ.
            response_history:
              type: array
              description: Сохранённые HTTP-ответы всех попыток доставки callback.
              items:
                type: object
                properties:
                  attempt: { type: integer }
                  received_at: { type: string, format: date-time }
                  http_status: { type: integer }
                  content_type: { type: string, nullable: true }
                  body: { type: string }
                  body_truncated: { type: boolean }
            next_retry_at: { type: string, format: date-time, nullable: true }
            delivered_at: { type: string, format: date-time, nullable: true }
        execution:
          $ref: '#/components/schemas/Execution'
    JobResponse:
      type: object
      properties:
        job:
          $ref: '#/components/schemas/Job'
        idempotent:
          type: boolean
    JobLog:
      type: object
      properties:
        ts:
          type: string
          format: date-time
        level:
          type: string
          enum: [debug, info, warn, error]
        message:
          type: string
        details:
          type: object
          additionalProperties: true
    SystemConfig:
      type: object
      properties:
        max_parallel_jobs:
          type: integer
          example: 1
        default_job_timeout_ms:
          type: integer
          example: 30000
        job_retention_days:
          type: integer
          minimum: 1
          default: 30
          description: Срок хранения завершённых заданий, их логов, результатов и артефактов в днях.
        retry_policy:
          $ref: '#/components/schemas/RetryPolicy'
security:
  - ApiKeyAuth: []
paths:
  /live:
    get:
      tags: [Сервис]
      summary: Проверить доступность HTTP API без ожидания пользовательского сеанса
      description: Доступен также как /api/v2/live. HTTP 200 не подтверждает готовность браузера или ЭЦП; для этого проверьте /health и сценарий СБИС.
      security: []
      responses:
        "200":
          description: API отвечает
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string}
                  api_available: {type: boolean}
                  un_id: {type: string}
                  version: {type: string}
  /api/v2/system/worker/status:
    get:
      tags: [Система]
      summary: Получить состояние исполнителя
      responses:
        "200":
          description: Состояние worker
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkerStatus'
  /health:
    get:
      tags: [Сервис]
      summary: Проверить состояние сервиса
      security: []
      responses:
        "200":
          description: Сервис доступен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        "503":
          description: Сервис отвечает, но ещё не готов принимать задания
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /interpreter/actions:
    get:
      tags: [Интерпретатор]
      summary: Получить зарегистрированные действия
      responses:
        "200":
          description: Названия зарегистрированных действий
          content:
            application/json:
              schema:
                type: object
                properties:
                  actions:
                    type: array
                    items:
                      type: string
                  formats:
                    type: object
                    description: Операции по форматам json-workflow и json-steps.
                    additionalProperties:
                      type: array
                      items:
                        type: string
  /jobs:
    get:
      tags: [Задания]
      summary: Получить список заданий
      parameters:
        - in: query
          name: status
          description: Фильтр по статусу задания.
          schema:
            type: string
        - in: query
          name: limit
          description: Максимальное количество заданий в ответе.
          schema:
            type: integer
      responses:
        "200":
          description: Список заданий
    post:
      tags: [Задания]
      summary: Создать задание
      parameters:
        - in: header
          name: Idempotency-Key
          required: false
          schema:
            type: string
          description: Необязательный ключ идемпотентности для безопасного повторного создания задания.
          example: job-2026-06-08-001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobCreateRequest'
            examples:
              separatedContract:
                summary: Новый формат — параметры и текст сценария разделены
                value:
                  parameters:
                    uid: 1c-job-000042
                    priority: 30
                    timeout_ms: 120000
                    log_level: info
                    context:
                      delay_ms: 15000
                  script_text: '{"default_step_timeout_ms":60000,"steps":[{"action":"wait","params":{"duration_ms":"{{delay_ms}}"}}]}'
              stage4OneC:
                summary: Этап 4 — управляемая задержка и возврат результата в 1С
                value:
                  uid: 1c-stage4-delay-001
                  priority: 30
                  timeout_ms: 120000
                  retry_policy: { max_attempts: 2, backoff_ms: 1000 }
                  context:
                    delay_ms: 15000
                  callback:
                    url: http://1c-test.local:8080/script-factory/result
                    max_attempts: 5
                    backoff_ms: 1000
                    timeout_ms: 5000
                  script:
                    default_step_timeout_ms: 60000
                    steps:
                      - id: accept
                        title: Принять параметры из 1С
                        description: Фиксирует начало обработки задания.
                        action: noop
                        duration_ms: 100
                      - id: controlled-delay
                        title: Управляемая задержка
                        description: Ожидает указанное 1С время без внешних действий.
                        action: wait
                        params: { duration_ms: "{{delay_ms}}" }
                        timeout_ms: 60000
              browserReplay:
                summary: Нативный Chrome Recorder JSON — реальная отправка Yahoo → Gmail
                value:
                  uid: mail-stage3-00042
                  priority: 5
                  timeout_ms: 120000
                  context:
                    mail_to: 10sydneyfc@gmail.com
                    mail_subject: Проверка автоматизации
                    mail_body: Реальное письмо отправлено из seeergo@yahoo.com через Chromium.
                  script:
                    title: Реальная отправка Yahoo → Gmail
                    timeout: 15000
                    steps:
                      - title: Настроить окно Chromium
                        description: Устанавливает размер окна для демонстрации.
                        type: setViewport
                        width: 1400
                        height: 860
                        deviceScaleFactor: 1
                        isMobile: false
                        hasTouch: false
                        isLandscape: false
                      - title: Открыть Yahoo
                        description: Переходит на страницу входа Yahoo Mail.
                        type: navigate
                        url: "{{yahoo_mail_url}}"
                      - title: Ввести адрес Yahoo
                        description: Вводит адрес отправителя из конфигурации сервера.
                        type: change
                        selectors: [["#username"], ["input[name='username']"]]
                        value: "{{yahoo_login}}"
                      - title: Ввести пароль Yahoo
                        description: Использует YAHOO_MAIL_PASSWORD и маскирует значение в логах.
                        type: change
                        selectors: [["#login-passwd"], ["input[type='password']"]]
                        value: "{{yahoo_password}}"
                      - title: Указать получателя
                        description: Заполняет адрес Gmail из context.
                        type: change
                        selectors: [["[data-test-id='compose-to']"], ["#message-to-field"]]
                        value: "{{mail_to}}"
                      - type: waitForElement
                        selectors: [["#mail-compose"]]
                        visible: true
              success:
                summary: Успешная цепочка с подстановкой параметров
                value:
                  priority: 10
                  timeout_ms: 15000
                  retry_policy:
                    max_attempts: 2
                    backoff_ms: 500
                  script:
                    context:
                      current_ip: 192.168.1.10
                      root_dir: ./demo-data/incoming
                      loaded_dir: ./demo-data/loaded
                      receipt_dir: ./demo-data/downloads
                      prefixes: [FNS, SFR, ROSSTAT]
                    steps:
                      - action: check_ip
                        delay_ms: 250
                        params: { expected_ip: 192.168.1.10 }
                      - action: find_files
                        delay_ms: 250
                        params:
                          directory: "{{root_dir}}"
                          prefixes: "{{prefixes}}"
                      - action: launch_browser
                        delay_ms: 250
                      - action: navigate
                        delay_ms: 250
                        params: { url: https://online.sbis.ru }
                      - action: auth_ecp
                        delay_ms: 250
                      - action: upload_files
                        delay_ms: 250
                        params: { files: "{{found_files}}" }
                      - action: validate_report
                        delay_ms: 250
                        params: { valid: true }
                      - action: submit_if_valid
                        delay_ms: 250
                      - id: receipt
                        action: download_files
                        delay_ms: 250
                        params:
                          destination: "{{receipt_dir}}"
                          files:
                            - filename: submission-receipt.pdf
                              source_url: https://online.sbis.ru/reports/receipt.pdf
                              mime_type: application/pdf
                              size_bytes: 48231
                      - action: move_files
                        delay_ms: 250
                        params:
                          files: "{{found_files}}"
                          destination: "{{loaded_dir}}"
              fileNotFound:
                summary: Нормализованная ошибка FILE_NOT_FOUND
                value:
                  timeout_ms: 5000
                  retry_policy: { max_attempts: 1, backoff_ms: 200 }
                  script:
                    context:
                      root_dir: ./demo-data/empty
                      prefixes: [FNS]
                    steps:
                      - action: find_files
                        delay_ms: 300
                        params:
                          directory: "{{root_dir}}"
                          prefixes: "{{prefixes}}"
              retry:
                summary: Временный сбой СБИС Плагина и повторная попытка
                value:
                  timeout_ms: 8000
                  retry_policy: { max_attempts: 2, backoff_ms: 700 }
                  script:
                    steps:
                      - action: launch_browser
                        delay_ms: 300
                      - action: auth_ecp
                        delay_ms: 300
                        params: { fail_attempts: 1 }
                      - action: navigate
                        delay_ms: 300
                        params: { url: https://online.sbis.ru }
              timeout:
                summary: Превышение тайм-аута шага
                value:
                  timeout_ms: 3000
                  retry_policy: { max_attempts: 1, backoff_ms: 200 }
                  script:
                    steps:
                      - action: noop
                        timeout_ms: 250
                        delay_ms: 1200
      responses:
        "200":
          description: "Ранее созданное задание с тем же uid/Idempotency-Key (idempotent=true)"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobResponse'
        "201":
          description: Задание создано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobResponse'
        "400":
          description: Некорректный контракт задания или сценария
        "409":
          description: uid уже существует, но параметры или сценарий отличаются
  /jobs/by-uid/{uid}:
    get:
      tags: [Задания]
      summary: Получить задание по внешнему uid
      parameters:
        - in: path
          name: uid
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Задание найдено
          content:
            application/json:
              schema:
                type: object
                properties:
                  job:
                    $ref: '#/components/schemas/Job'
        "404":
          description: Задание не найдено
  /jobs/{job_id}:
    get:
      tags: [Задания]
      summary: Получить задание
      parameters:
        - in: path
          name: job_id
          description: Идентификатор задания.
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Задание
          content:
            application/json:
              schema:
                type: object
                properties:
                  job:
                    $ref: '#/components/schemas/Job'
    delete:
      tags: [Задания]
      summary: Удалить задание вместе с файлами артефактов
      description: >-
        Удаляет запись задания (включая журнал) и каталог артефактов
        data/artifacts/{job_id}. Выполняющееся задание удалить нельзя —
        сначала отмените его. Ожидающее задание удаляется из очереди,
        отложенная доставка callback отменяется.
      parameters:
        - in: path
          name: job_id
          description: Идентификатор задания.
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Задание удалено
          content:
            application/json:
              schema:
                type: object
                required: [deleted, job_id, artifacts_removed]
                properties:
                  deleted:
                    type: boolean
                  job_id:
                    type: string
                  artifacts_removed:
                    type: boolean
        "404":
          description: Задание не найдено
        "409":
          description: Задание выполняется и не может быть удалено
  /jobs/{job_id}/cancel:
    post:
      tags: [Задания]
      summary: Отменить задание
      parameters:
        - in: path
          name: job_id
          description: Идентификатор задания.
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Задание отменено
  /jobs/{job_id}/logs:
    get:
      tags: [Задания]
      summary: Получить журнал задания
      parameters:
        - in: path
          name: job_id
          description: Идентификатор задания.
          required: true
          schema:
            type: string
        - in: query
          name: min_level
          description: Минимальная важность возвращаемых записей.
          schema:
            $ref: '#/components/schemas/LogLevel'
      responses:
        "200":
          description: Журнал задания
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_id:
                    type: string
                  log_level:
                    $ref: '#/components/schemas/LogLevel'
                  logs:
                    type: array
                    items:
                      $ref: '#/components/schemas/JobLog'
  /jobs/{job_id}/artifacts/{artifact_id}:
    get:
      tags: [Задания]
      summary: Скачать артефакт задания с авторизацией X-API-Key
      parameters:
        - in: path
          name: job_id
          required: true
          schema:
            type: string
        - in: path
          name: artifact_id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Содержимое файла
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          description: Артефакт или файл не найден
  /system/resources:
    get:
      tags: [Система]
      summary: Получить сведения о ресурсах системы
      responses:
        "200":
          description: Ресурсы системы
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemResources'
  /system/ip-check:
    get:
      tags: [Система]
      summary: Проверить соответствие внешнего IP УН адресу из settings.ini
      description: >-
        Читает C:\_external ip monitor\settings.ini ([main] ip_adress), определяет
        внешний адрес через ipify. Если корректный IP не совпадает, запрашивает api.2ip.io
        и сравнивает с тем же значением settings.ini. Совпадение любого из этих последовательных
        ответов даёт успех; возвращается IP подтвердившего сервиса. Второй ресурс вызывается
        только при несовпадении, не при ошибке или тайм-ауте первого. Каждый этап ограничен
        3 секундами (до 6 секунд суммарно). URL задаются через IP_CHECK_URL и IP_CHECK_FALLBACK_URL.
      responses:
        "200":
          description: Проверка пройдена
          content:
            application/json:
              schema:
                type: object
                required: [status, ip]
                properties:
                  status:
                    type: string
                    enum: [success]
                  ip:
                    type: string
                    description: Фактический внешний IP от ipify либо резервного 2ip, совпавший с settings.ini.
        "503":
          description: Проверка не пройдена
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        enum: [IP_SETTINGS_READ_FAILED, IP_SETTINGS_INVALID, IP_LOOKUP_FAILED, IP_LOOKUP_INVALID, IP_MISMATCH, IP_CHECK_TIMEOUT]
                      message:
                        type: string
  /system/maintenance:
    get:
      tags: [Система]
      summary: Состояние обслуживания, владелец и незавершённые работы
      responses:
        "200":
          description: Состояние; обслуживание сохраняется при перезапуске API
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MaintenanceStatus'}
  /system/maintenance/begin:
    post:
      tags: [Система]
      summary: Закрыть приём заданий и заблокировать выключение до завершения обслуживания
      description: Уже принятые работы продолжают выполняться. /health возвращает 503 и ready=false. Новый POST jobs возвращает SERVICE_MAINTENANCE. Состояние сохраняется на диске; автоматического тайм-аута снятия нет.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MaintenanceRequest'}
      responses:
        "200": {description: Приём закрыт; дождитесь ready_to_update}
        "409": {description: Обслуживание принадлежит другой операции}
        "503": {description: УН уже переходит в выключение или останавливается}
  /system/maintenance/seal:
    post:
      tags: [Система]
      summary: После завершения работ закрыть скачивания и изменения API
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MaintenanceRequest'}
      responses:
        "200": {description: Можно останавливать API для установки}
        "409": {description: Другой владелец или ещё выполняются работы}
  /system/maintenance/verify:
    post:
      tags: [Система]
      summary: Фиксированная безопасная проверка JSON-исполнителя и записи/чтения артефакта
      description: Только в installing с тем же owner. Произвольный сценарий не принимается. Не запускает браузер, ЭЦП, callback или отправку отчётности.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MaintenanceRequest'}
      responses:
        "200":
          description: Проверка исполнителя и артефакта успешна
          content:
            application/json:
              schema:
                type: object
                properties:
                  verified: {type: boolean}
                  version: {type: string}
                  un_id: {type: string}
                  checks: {type: array, items: {type: string}}
        "409": {description: Не тот владелец, не закрыты скачивания или УН занята}
  /system/maintenance/end:
    post:
      tags: [Система]
      summary: Снять обслуживание после подтверждённого восстановления
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MaintenanceRequest'}
      responses:
        "200": {description: Возобновлены приём заданий и прежняя политика питания}
        "409": {description: Другой владелец или ещё выполняется проверка}
  /system/power/suspend:
    post:
      tags: [Система]
      summary: Принять запрос проверки условий и перехода Windows в спящий режим
      description: >-
        Требует enabled=true. Возвращает только факт принятия вызова; 202 не означает,
        что УН уснула. После отправки ответа проверяет очередь, сеансы пользователей,
        порог бездействия и поддержку выбранного sleep/hibernate. При mode=shutdown вернёт 409 POWER_MODE_MISMATCH; используйте /system/power/shutdown. Принудительного закрытия приложений нет.
        При занятой очереди или активном пользователе переход не выполняется.
      requestBody:
        required: false
        content:
          application/json:
            schema: {type: object, additionalProperties: false}
            example: {}
      responses:
        "202":
          description: Вызов принят; результат алгоритма не передаётся в 1С
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string, enum: [accepted]}
        "400": {description: Некорректное тело запроса}
        "401": {description: Неверный X-API-Key}
        "409": {description: При mode=shutdown используйте /system/power/shutdown}
        "503": {description: Модуль отключён, ОС не поддерживается или идёт переход в сон}
  /system/power/shutdown:
    post:
      tags: [Система]
      summary: Принять запрос проверки условий и штатного выключения Windows
      description: >-
        Требует enabled=true и mode=shutdown (иначе 409 POWER_MODE_MISMATCH).
        После ответа 202 проверяет очередь и активность пользователей тем же алгоритмом.
        dry_run=true только записывает WOULD_SHUTDOWN. При dry_run=false запрашивает
        штатное выключение Windows без перезапуска и принудительного закрытия приложений.
        202 не подтверждает выключение. После принятия команды Windows API не принимает
        новые задания до перезапуска процесса. Приложения могут задержать или отменить выключение.
      requestBody:
        required: false
        content:
          application/json:
            schema: {type: object, additionalProperties: false}
            example: {}
      responses:
        "202":
          description: Вызов принят; результат алгоритма не передаётся в 1С
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string, enum: [accepted]}
        "400": {description: Некорректное тело запроса}
        "409": {description: Неверный mode; требуется shutdown}
        "401": {description: Неверный X-API-Key}
        "503": {description: Модуль отключён, ОС не поддерживается или идёт переход питания}
  /system/power/status:
    get:
      tags: [Система]
      summary: Диагностика модуля suspend, текущие настройки и последняя причина блокировки
      responses:
        "200": {description: supported, config, checking, committing, last}
        "401": {description: Неверный X-API-Key}
  /system/power/sessions:
    get:
      tags: [Система]
      summary: Прочитать Windows-сеансы, время бездействия, поддержку сна и наличие привилегии
      description: Диагностическая операция, не переводит УН в сон. Требует прав чтения чужих сеансов Windows.
      responses:
        "200": {description: Полный снимок WTS-сеансов и возможностей suspend}
        "401": {description: Неверный X-API-Key}
        "503": {description: Windows API недоступен, недостаточно прав или неверная исключаемая учётная запись}
  /system/power/config:
    get:
      tags: [Система]
      summary: Получить действующие настройки suspend
      responses:
        "200":
          description: Настройки
          content:
            application/json:
              schema:
                type: object
                properties:
                  config: {$ref: '#/components/schemas/PowerConfig'}
    patch:
      tags: [Система]
      summary: Изменить настройки suspend и сохранить на УН без перезапуска API
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PowerConfig'}
            example: {enabled: true, background_enabled: true, dry_run: true, user_idle_seconds: 1800}
      responses:
        "200": {description: Настройки сохранены в DATA_DIR/power/config.json}
        "400": {description: Неверное поле, тип или значение}
        "401": {description: Неверный X-API-Key}
        "409": {description: Настройки изменяются во время перехода в suspend}
        "503": {description: УН переходит в suspend}
  /system/power/cancel:
    post:
      tags: [Система]
      summary: Отменить текущую проверку или отсрочку suspend
      description: Не отключает будущие фоновые проверки; для этого измените background_enabled или enabled.
      requestBody:
        required: false
        content:
          application/json:
            schema: {type: object, additionalProperties: false}
      responses:
        "200": {description: Отмена принята}
        "400": {description: Некорректное тело запроса}
        "401": {description: Неверный X-API-Key}
        "409": {description: Переход начался во время чтения запроса; отмена недоступна}
        "503": {description: Переход в suspend уже начат; отмена недоступна}
  /system/config:
    get:
      tags: [Система]
      summary: Получить настройки
      responses:
        "200":
          description: Настройки
    put:
      tags: [Система]
      summary: Обновить настройки
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SystemConfig'
            example:
              max_parallel_jobs: 2
              default_job_timeout_ms: 30000
              job_retention_days: 30
              retry_policy:
                max_attempts: 2
                backoff_ms: 500
      responses:
        "200":
          description: Обновлённые настройки
