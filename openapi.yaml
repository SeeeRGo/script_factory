openapi: 3.0.3
info:
  title: API «Фабрика сценариев»
  description: Управление очередью и выполнением JSON-сценариев, включая нативные записи Chrome Recorder через Puppeteer Replay.
  version: 0.2.0
servers:
  - url: http://localhost:33001/api/v2
    description: API в Docker Compose
  - url: /api/v2
    description: Относительный путь для развёртывания на том же домене
tags:
  - name: Сервис
    description: Состояние сервиса
  - name: Интерпретатор
    description: Возможности интерпретатора JSON-шагов
  - name: Задания
    description: Управление заданиями и их выполнением
  - name: Система
    description: Ресурсы и настройки системы
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
  schemas:
    RetryPolicy:
      type: object
      properties:
        max_attempts:
          type: integer
          minimum: 1
          example: 2
        backoff_ms:
          type: integer
          minimum: 0
          example: 500
    ScriptStep:
      type: object
      required: [action]
      properties:
        id:
          type: string
          example: locate-reports
        action:
          type: string
          enum: [noop, check_ip, launch_browser, navigate, auth_ecp, find_files, upload_files, download_files, validate_report, submit_if_valid, move_files]
          example: find_files
        params:
          type: object
          additionalProperties: true
          description: Параметры действия. Поддерживаются шаблоны контекста `{{root_dir}}` и `{{found_files}}`.
        timeout_ms:
          type: integer
          minimum: 1
          description: Максимальное время выполнения шага.
          example: 5000
        duration_ms:
          type: number
          minimum: 0
          description: Длительность тестового действия для демо этапа 2.
          example: 250
        delay_ms:
          type: number
          minimum: 0
          description: Альтернативное имя искусственной задержки для демонстрационных сценариев.
          example: 250
    JsonScript:
      type: object
      description: Обратно совместимый сценарий внутренних JSON Steps этапа 2.
      required: [steps]
      properties:
        context:
          type: object
          additionalProperties: true
          description: Начальный контекст сценария.
        default_step_timeout_ms:
          type: integer
          minimum: 1
          example: 10000
        steps:
          type: array
          items:
            $ref: '#/components/schemas/ScriptStep'
    ReplayStep:
      type: object
      required: [type]
      description: Стандартный шаг Chrome DevTools Recorder. Набор полей зависит от type и проверяется @puppeteer/replay.
      properties:
        type:
          type: string
          enum: [setViewport, navigate, click, doubleClick, change, hover, scroll, keyDown, keyUp, waitForElement, waitForExpression, emulateNetworkConditions, close]
        timeout:
          type: integer
          minimum: 1
          maximum: 30000
        selectors:
          type: array
          description: Альтернативные CSS, ARIA, text, XPath или pierce-селекторы Recorder.
          items: {}
      additionalProperties: true
    PuppeteerReplayScript:
      type: object
      required: [title, steps]
      description: Нативный JSON, экспортированный через Chrome DevTools Recorder → Export → JSON.
      properties:
        title:
          type: string
        timeout:
          type: integer
          minimum: 1
          maximum: 30000
        selectorAttribute:
          type: string
        steps:
          type: array
          items:
            $ref: '#/components/schemas/ReplayStep'
    AnyScript:
      oneOf:
        - $ref: '#/components/schemas/PuppeteerReplayScript'
        - $ref: '#/components/schemas/JsonScript'
    JobCreateRequest:
      type: object
      properties:
        uid:
          type: string
          description: Идентификатор задания во внешней системе и ключ идемпотентности. Также поддерживается Idempotency-Key.
        priority:
          type: integer
          description: Чем меньше значение, тем выше приоритет.
          example: 100
        timeout_ms:
          type: integer
          description: Тайм-аут задания в миллисекундах.
          example: 30000
        retry_policy:
          $ref: '#/components/schemas/RetryPolicy'
        context:
          type: object
          additionalProperties: true
          description: Начальный контекст интерпретатора, переопределяющий одноимённые значения сценария.
        script:
          $ref: '#/components/schemas/AnyScript'
    ExecutionStep:
      type: object
      properties:
        index:
          type: integer
        id:
          type: string
        action:
          type: string
          description: action для JSON Steps или type для Puppeteer Replay.
        status:
          type: string
          enum: [pending, running, success, failed]
        attempt:
          type: integer
          nullable: true
        started_at:
          type: string
          format: date-time
          nullable: true
        finished_at:
          type: string
          format: date-time
          nullable: true
        duration_ms:
          type: integer
          nullable: true
        params:
          type: object
          nullable: true
          additionalProperties: true
        output:
          type: object
          nullable: true
          additionalProperties: true
        error:
          $ref: '#/components/schemas/ErrorBody'
    Execution:
      type: object
      properties:
        status:
          type: string
        total_steps:
          type: integer
        completed_steps:
          type: integer
        current_step:
          type: integer
          nullable: true
        percent:
          type: integer
          minimum: 0
          maximum: 100
        duration_ms:
          type: integer
          nullable: true
        context:
          type: object
          nullable: true
          additionalProperties: true
        steps:
          type: array
          items:
            $ref: '#/components/schemas/ExecutionStep'
    ErrorBody:
      type: object
      nullable: true
      properties:
        code:
          type: string
          example: VALIDATION_ERROR
        message:
          type: string
        retryable:
          type: boolean
        step_index:
          type: integer
          description: Номер шага, начиная с 1.
        action:
          type: string
        details:
          type: object
          additionalProperties: true
    Artifact:
      type: object
      required: [artifact_id, kind, filename, local_path]
      properties:
        artifact_id:
          type: string
          description: Стабильный идентификатор артефакта в рамках результата задания.
        kind:
          type: string
          enum: [downloaded_file, browser_screenshot]
        filename:
          type: string
        local_path:
          type: string
          description: Путь к файлу на УН, выполнившей задание.
        source_url:
          type: string
          format: uri
          nullable: true
        public_url:
          type: string
          nullable: true
          description: Защищённая ссылка интерфейса на артефакт, если он доступен для просмотра.
        mime_type:
          type: string
          nullable: true
        size_bytes:
          type: integer
          minimum: 0
          nullable: true
        checksum_sha256:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
    JobResult:
      type: object
      nullable: true
      required: [job_id, uid, un_id, artifacts]
      properties:
        job_id:
          type: string
        uid:
          type: string
          description: Идентификатор задания во внешней системе.
        un_id:
          type: string
          description: Идентификатор УН, выполнившей задание.
        message:
          type: string
        steps_executed:
          type: integer
        duration_ms:
          type: integer
        context:
          type: object
          additionalProperties: true
        artifacts:
          type: array
          items:
            $ref: '#/components/schemas/Artifact'
        simulated_outcome:
          type: string
        runtime:
          type: string
          enum: [json-steps, puppeteer-replay]
    QueueHealth:
      type: object
      required: [status, queued, running, max_parallel_jobs, available_slots]
      properties:
        status:
          type: string
          enum: [idle, processing, busy]
        queued:
          type: integer
          minimum: 0
        running:
          type: integer
          minimum: 0
        max_parallel_jobs:
          type: integer
          minimum: 1
        available_slots:
          type: integer
          minimum: 0
    HealthResponse:
      type: object
      required: [status, service, request_id, un_id, queue]
      properties:
        status:
          type: string
          enum: [ok]
        service:
          type: string
        request_id:
          type: string
        un_id:
          type: string
        queue:
          $ref: '#/components/schemas/QueueHealth'
        browser_replay:
          type: object
          properties:
            available:
              type: boolean
            engine:
              type: string
            headless:
              type: boolean
            step_delay_ms:
              type: number
            live_view:
              type: object
              properties:
                enabled:
                  type: boolean
                port:
                  type: integer
                public_url:
                  type: string
                  nullable: true
                path:
                  type: string
    SystemResources:
      type: object
      properties:
        un_id:
          type: string
        uptime_seconds:
          type: integer
        memory_usage:
          type: object
          additionalProperties: true
        jobs_total:
          type: integer
        jobs_running:
          type: integer
        jobs_queued:
          type: integer
        queue:
          $ref: '#/components/schemas/QueueHealth'
        node_version:
          type: string
    Job:
      type: object
      properties:
        job_id:
          type: string
        uid:
          type: string
        un_id:
          type: string
        status:
          type: string
          enum: [queued, running, retrying, success, failed, validation_failed, cancelled, timeout]
        priority:
          type: integer
        attempts:
          type: integer
        max_attempts:
          type: integer
        backoff_ms:
          type: integer
        timeout_ms:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
          nullable: true
        finished_at:
          type: string
          format: date-time
          nullable: true
        result:
          $ref: '#/components/schemas/JobResult'
        error:
          $ref: '#/components/schemas/ErrorBody'
        execution:
          $ref: '#/components/schemas/Execution'
    JobResponse:
      type: object
      properties:
        job:
          $ref: '#/components/schemas/Job'
        idempotent:
          type: boolean
    JobLog:
      type: object
      properties:
        ts:
          type: string
          format: date-time
        level:
          type: string
          enum: [debug, info, warn, error]
        message:
          type: string
        details:
          type: object
          additionalProperties: true
    SystemConfig:
      type: object
      properties:
        max_parallel_jobs:
          type: integer
          example: 1
        default_job_timeout_ms:
          type: integer
          example: 30000
        retry_policy:
          $ref: '#/components/schemas/RetryPolicy'
security:
  - ApiKeyAuth: []
paths:
  /health:
    get:
      tags: [Сервис]
      summary: Проверить состояние сервиса
      security: []
      responses:
        "200":
          description: Сервис доступен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /interpreter/actions:
    get:
      tags: [Интерпретатор]
      summary: Получить зарегистрированные действия
      responses:
        "200":
          description: Названия зарегистрированных действий
          content:
            application/json:
              schema:
                type: object
                properties:
                  actions:
                    type: array
                    items:
                      type: string
  /jobs:
    get:
      tags: [Задания]
      summary: Получить список заданий
      parameters:
        - in: query
          name: status
          description: Фильтр по статусу задания.
          schema:
            type: string
        - in: query
          name: limit
          description: Максимальное количество заданий в ответе.
          schema:
            type: integer
      responses:
        "200":
          description: Список заданий
    post:
      tags: [Задания]
      summary: Создать задание
      parameters:
        - in: header
          name: Idempotency-Key
          required: false
          schema:
            type: string
          description: Необязательный ключ идемпотентности для безопасного повторного создания задания.
          example: job-2026-06-08-001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobCreateRequest'
            examples:
              browserReplay:
                summary: Нативный Chrome Recorder JSON — отправка письма
                value:
                  uid: mail-stage3-00042
                  priority: 5
                  timeout_ms: 45000
                  context:
                    mail_to: demo.recipient@example.test
                    mail_subject: Проверка автоматизации
                    mail_body: Письмо отправлено реальным Chromium.
                  script:
                    title: Вход в почту и отправка письма
                    timeout: 10000
                    steps:
                      - type: setViewport
                        width: 1280
                        height: 900
                        deviceScaleFactor: 1
                        isMobile: false
                        hasTouch: false
                        isLandscape: false
                      - type: navigate
                        url: "{{demo_mail_url}}"
                      - type: change
                        selectors: [["#mail-login"], ["aria/Логин"]]
                        value: "{{mail_login}}"
                      - type: change
                        selectors: [["#mail-password"], ["aria/Пароль"]]
                        value: "{{mail_password}}"
                      - type: click
                        selectors: [["#mail-login-submit"], ["aria/Войти"]]
                        offsetX: 150
                        offsetY: 20
                      - type: waitForElement
                        selectors: [["#mail-compose"]]
                        visible: true
              success:
                summary: Успешная цепочка с подстановкой параметров
                value:
                  priority: 10
                  timeout_ms: 15000
                  retry_policy:
                    max_attempts: 2
                    backoff_ms: 500
                  script:
                    context:
                      current_ip: 192.168.1.10
                      root_dir: ./demo-data/incoming
                      loaded_dir: ./demo-data/loaded
                      receipt_dir: ./demo-data/downloads
                      prefixes: [FNS, SFR, ROSSTAT]
                    steps:
                      - action: check_ip
                        delay_ms: 250
                        params: { expected_ip: 192.168.1.10 }
                      - action: find_files
                        delay_ms: 250
                        params:
                          directory: "{{root_dir}}"
                          prefixes: "{{prefixes}}"
                      - action: launch_browser
                        delay_ms: 250
                      - action: navigate
                        delay_ms: 250
                        params: { url: https://online.sbis.ru }
                      - action: auth_ecp
                        delay_ms: 250
                      - action: upload_files
                        delay_ms: 250
                        params: { files: "{{found_files}}" }
                      - action: validate_report
                        delay_ms: 250
                        params: { valid: true }
                      - action: submit_if_valid
                        delay_ms: 250
                      - id: receipt
                        action: download_files
                        delay_ms: 250
                        params:
                          destination: "{{receipt_dir}}"
                          files:
                            - filename: submission-receipt.pdf
                              source_url: https://online.sbis.ru/reports/receipt.pdf
                              mime_type: application/pdf
                              size_bytes: 48231
                      - action: move_files
                        delay_ms: 250
                        params:
                          files: "{{found_files}}"
                          destination: "{{loaded_dir}}"
              fileNotFound:
                summary: Нормализованная ошибка FILE_NOT_FOUND
                value:
                  timeout_ms: 5000
                  retry_policy: { max_attempts: 1, backoff_ms: 200 }
                  script:
                    context:
                      root_dir: ./demo-data/empty
                      prefixes: [FNS]
                    steps:
                      - action: find_files
                        delay_ms: 300
                        params:
                          directory: "{{root_dir}}"
                          prefixes: "{{prefixes}}"
              retry:
                summary: Временный сбой СБИС Плагина и повторная попытка
                value:
                  timeout_ms: 8000
                  retry_policy: { max_attempts: 2, backoff_ms: 700 }
                  script:
                    steps:
                      - action: launch_browser
                        delay_ms: 300
                      - action: auth_ecp
                        delay_ms: 300
                        params: { fail_attempts: 1 }
                      - action: navigate
                        delay_ms: 300
                        params: { url: https://online.sbis.ru }
              timeout:
                summary: Превышение тайм-аута шага
                value:
                  timeout_ms: 3000
                  retry_policy: { max_attempts: 1, backoff_ms: 200 }
                  script:
                    steps:
                      - action: noop
                        timeout_ms: 250
                        delay_ms: 1200
      responses:
        "201":
          description: Задание создано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobResponse'
        "400":
          description: Некорректный контракт задания или сценария
  /jobs/{job_id}:
    get:
      tags: [Задания]
      summary: Получить задание
      parameters:
        - in: path
          name: job_id
          description: Идентификатор задания.
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Задание
          content:
            application/json:
              schema:
                type: object
                properties:
                  job:
                    $ref: '#/components/schemas/Job'
  /jobs/{job_id}/cancel:
    post:
      tags: [Задания]
      summary: Отменить задание
      parameters:
        - in: path
          name: job_id
          description: Идентификатор задания.
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Задание отменено
  /jobs/{job_id}/logs:
    get:
      tags: [Задания]
      summary: Получить журнал задания
      parameters:
        - in: path
          name: job_id
          description: Идентификатор задания.
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Журнал задания
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_id:
                    type: string
                  logs:
                    type: array
                    items:
                      $ref: '#/components/schemas/JobLog'
  /system/resources:
    get:
      tags: [Система]
      summary: Получить сведения о ресурсах системы
      responses:
        "200":
          description: Ресурсы системы
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemResources'
  /system/config:
    get:
      tags: [Система]
      summary: Получить настройки
      responses:
        "200":
          description: Настройки
    put:
      tags: [Система]
      summary: Обновить настройки
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SystemConfig'
            example:
              max_parallel_jobs: 2
              default_job_timeout_ms: 30000
              retry_policy:
                max_attempts: 2
                backoff_ms: 500
      responses:
        "200":
          description: Обновлённые настройки
