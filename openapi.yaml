openapi: 3.0.3
info:
  title: API «Фабрика сценариев»
  description: API этапа 4 для интеграции 1С с очередью УН, получения статуса, результата и гарантируемого callback, включая JSON Steps и записи Chrome Recorder через Puppeteer Replay.
  version: 0.3.0
servers:
  - url: http://TEST_UN_HOST:33001/api/v2
    description: Тестовая УН Windows (заменить TEST_UN_HOST на имя или IP машины)
  - url: http://localhost:33001/api/v2
    description: API в Docker Compose
  - url: /api/v2
    description: Относительный путь для развёртывания на том же домене
tags:
  - name: Сервис
    description: Состояние сервиса
  - name: Интерпретатор
    description: Возможности интерпретатора JSON-шагов
  - name: Задания
    description: Управление заданиями и их выполнением
  - name: Система
    description: Ресурсы и настройки системы
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
  schemas:
    RetryPolicy:
      type: object
      properties:
        max_attempts:
          type: integer
          minimum: 1
          example: 2
        backoff_ms:
          type: integer
          minimum: 0
          example: 500
    ScriptStep:
      type: object
      required: [action]
      properties:
        id:
          type: string
          example: locate-reports
        title:
          type: string
          description: Короткое человекочитаемое название шага.
        description:
          type: string
          description: Объяснение действия и ожидаемого результата шага.
        action:
          type: string
          enum: [noop, wait, check_ip, launch_browser, navigate, auth_ecp, find_files, upload_files, download_files, validate_report, submit_if_valid, move_files, copy_files, read_text_file, write_text_file, open_file, delete_files]
          example: find_files
        params:
          type: object
          additionalProperties: true
          description: Параметры действия. Поддерживаются шаблоны контекста `{{root_dir}}` и `{{found_files}}`.
        timeout_ms:
          type: integer
          minimum: 1
          description: Максимальное время выполнения шага.
          example: 5000
        duration_ms:
          type: number
          minimum: 0
          description: Длительность действия; для явного ожидания используйте action=wait и params.duration_ms.
          example: 250
        delay_ms:
          type: number
          minimum: 0
          description: Альтернативное имя искусственной задержки для демонстрационных сценариев.
          example: 250
    JsonScript:
      type: object
      description: Обратно совместимый сценарий внутренних JSON Steps этапа 2.
      required: [steps]
      properties:
        context:
          type: object
          additionalProperties: true
          description: Начальный контекст сценария.
        default_step_timeout_ms:
          type: integer
          minimum: 1
          example: 10000
        inter_step_delay_ms:
          type: integer
          minimum: 0
          default: 0
          description: Пауза между успешными шагами в миллисекундах; 0 отключает задержки.
          example: 10000
        steps:
          type: array
          items:
            $ref: '#/components/schemas/ScriptStep'
    ReplayStep:
      type: object
      required: [type]
      description: Стандартный шаг Chrome DevTools Recorder. Набор полей зависит от type и проверяется @puppeteer/replay.
      properties:
        type:
          type: string
          enum: [setViewport, navigate, click, doubleClick, change, hover, scroll, keyDown, keyUp, waitForElement, waitForExpression, emulateNetworkConditions, close]
        timeout:
          type: integer
          minimum: 1
          maximum: 30000
        selectors:
          type: array
          description: Альтернативные CSS, ARIA, text, XPath или pierce-селекторы Recorder.
          items: {}
      additionalProperties: true
    PuppeteerReplayScript:
      type: object
      required: [title, steps]
      description: Нативный JSON, экспортированный через Chrome DevTools Recorder → Export → JSON.
      properties:
        title:
          type: string
        timeout:
          type: integer
          minimum: 1
          maximum: 30000
        selectorAttribute:
          type: string
        steps:
          type: array
          items:
            $ref: '#/components/schemas/ReplayStep'
    AnyScript:
      oneOf:
        - $ref: '#/components/schemas/PuppeteerReplayScript'
        - $ref: '#/components/schemas/JsonScript'
    CallbackConfig:
      type: object
      required: [url]
      description: Доставка финального результата в HTTP-сервис 1С. Авторизация задаётся на УН через CALLBACK_AUTH_TOKEN.
      properties:
        url:
          type: string
          format: uri
          example: http://1c-test.local/script-factory/result
        max_attempts:
          type: integer
          minimum: 1
          maximum: 20
          default: 5
        backoff_ms:
          type: integer
          minimum: 0
          maximum: 60000
          default: 1000
        timeout_ms:
          type: integer
          minimum: 1
          maximum: 60000
          default: 5000
    JobCreateRequest:
      type: object
      description: Поддерживает прежний плоский формат и новый формат с parameters + script_text. Смешивать параметры верхнего уровня с parameters нельзя.
      properties:
        parameters:
          $ref: '#/components/schemas/JobParameters'
        script_text:
          type: string
          description: Сценарий как сериализованный JSON-объект. Передаётся отдельно от parameters.
        uid:
          type: string
          description: Идентификатор задания во внешней системе и ключ идемпотентности. Также поддерживается Idempotency-Key.
        priority:
          type: integer
          description: Чем меньше значение, тем выше приоритет.
          example: 100
        timeout_ms:
          type: integer
          description: Тайм-аут задания в миллисекундах.
          example: 30000
        retry_policy:
          $ref: '#/components/schemas/RetryPolicy'
        callback:
          $ref: '#/components/schemas/CallbackConfig'
        context:
          type: object
          additionalProperties: true
          description: Начальный контекст интерпретатора, переопределяющий одноимённые значения сценария.
        log_level:
          $ref: '#/components/schemas/LogLevel'
        script:
          $ref: '#/components/schemas/AnyScript'
    JobParameters:
      type: object
      description: Параметры постановки задания в новом разделённом формате.
      properties:
        uid:
          type: string
          description: Внешний идентификатор заявки и ключ идемпотентности.
        priority:
          type: integer
          description: Чем меньше значение, тем выше приоритет.
        timeout_ms:
          type: integer
          minimum: 1
        retry_policy:
          $ref: '#/components/schemas/RetryPolicy'
        callback:
          $ref: '#/components/schemas/CallbackConfig'
        context:
          type: object
          additionalProperties: true
        log_level:
          $ref: '#/components/schemas/LogLevel'
    LogLevel:
      type: string
      enum: [debug, info, warn, error]
      default: info
    ExecutionStep:
      type: object
      properties:
        index:
          type: integer
        id:
          type: string
        action:
          type: string
          description: action для JSON Steps или type для Puppeteer Replay.
        title:
          type: string
          nullable: true
          description: Короткое человекочитаемое название шага.
        description:
          type: string
          nullable: true
          description: Объяснение действия и ожидаемого результата шага.
        status:
          type: string
          enum: [pending, running, success, failed]
        attempt:
          type: integer
          nullable: true
        started_at:
          type: string
          format: date-time
          nullable: true
        finished_at:
          type: string
          format: date-time
          nullable: true
        duration_ms:
          type: integer
          nullable: true
        params:
          type: object
          nullable: true
          additionalProperties: true
        output:
          type: object
          nullable: true
          additionalProperties: true
        error:
          $ref: '#/components/schemas/ErrorBody'
    Execution:
      type: object
      properties:
        status:
          type: string
        total_steps:
          type: integer
        completed_steps:
          type: integer
        current_step:
          type: integer
          nullable: true
        percent:
          type: integer
          minimum: 0
          maximum: 100
        duration_ms:
          type: integer
          nullable: true
        context:
          type: object
          nullable: true
          additionalProperties: true
        steps:
          type: array
          items:
            $ref: '#/components/schemas/ExecutionStep'
    ErrorBody:
      type: object
      nullable: true
      properties:
        code:
          type: string
          example: VALIDATION_ERROR
        message:
          type: string
        retryable:
          type: boolean
        step_index:
          type: integer
          description: Номер шага, начиная с 1.
        action:
          type: string
        details:
          type: object
          additionalProperties: true
    Artifact:
      type: object
      required: [artifact_id, kind, filename, local_path]
      properties:
        artifact_id:
          type: string
          description: Стабильный идентификатор артефакта в рамках результата задания.
        kind:
          type: string
          enum: [downloaded_file, browser_screenshot]
        filename:
          type: string
        local_path:
          type: string
          description: Путь к файлу на УН, выполнившей задание.
        source_url:
          type: string
          format: uri
          nullable: true
        public_url:
          type: string
          nullable: true
          description: Защищённая ссылка интерфейса на артефакт, если он доступен для просмотра.
        api_url:
          type: string
          description: Относительный API-адрес скачивания с заголовком X-API-Key.
        mime_type:
          type: string
          nullable: true
        size_bytes:
          type: integer
          minimum: 0
          nullable: true
        checksum_sha256:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
    JobResult:
      type: object
      nullable: true
      required: [job_id, uid, un_id, artifacts]
      properties:
        job_id:
          type: string
        uid:
          type: string
          description: Идентификатор задания во внешней системе.
        un_id:
          type: string
          description: Идентификатор УН, выполнившей задание.
        message:
          type: string
        steps_executed:
          type: integer
        duration_ms:
          type: integer
        context:
          type: object
          additionalProperties: true
        artifacts:
          type: array
          items:
            $ref: '#/components/schemas/Artifact'
        simulated_outcome:
          type: string
        runtime:
          type: string
          enum: [json-steps, puppeteer-replay]
    QueueHealth:
      type: object
      required: [status, queued, running, max_parallel_jobs, available_slots]
      properties:
        status:
          type: string
          enum: [idle, processing, busy]
        queued:
          type: integer
          minimum: 0
        running:
          type: integer
          minimum: 0
        max_parallel_jobs:
          type: integer
          minimum: 1
        available_slots:
          type: integer
          minimum: 0
    HealthResponse:
      type: object
      required: [status, ready, service, request_id, un_id, checks, queue]
      properties:
        status:
          type: string
          enum: [ok, error]
        ready:
          type: boolean
        service:
          type: string
        request_id:
          type: string
        un_id:
          type: string
        checks:
          type: object
          additionalProperties:
            type: object
            properties:
              status:
                type: string
                enum: [ok, error]
              message:
                type: string
              path:
                type: string
              executable_path:
                type: string
                nullable: true
        error:
          $ref: '#/components/schemas/ErrorBody'
        queue:
          $ref: '#/components/schemas/QueueHealth'
        browser_replay:
          type: object
          properties:
            available:
              type: boolean
            engine:
              type: string
            browser_product:
              type: string
            executable_path:
              type: string
              nullable: true
            headless:
              type: boolean
            step_delay_ms:
              type: number
            live_view:
              type: object
              properties:
                enabled:
                  type: boolean
                port:
                  type: integer
                public_url:
                  type: string
                  nullable: true
                embedded_url:
                  type: string
                path:
                  type: string
    SystemResources:
      type: object
      properties:
        un_id:
          type: string
        uptime_seconds:
          type: integer
        cpu:
          type: object
          properties:
            logical_cores: { type: integer }
            system_percent: { type: number }
            process_percent: { type: number }
            load_average:
              type: array
              items: { type: number }
        memory:
          type: object
          properties:
            total_bytes: { type: integer }
            free_bytes: { type: integer }
            used_percent: { type: number }
            process_rss_bytes: { type: integer }
            process_heap_used_bytes: { type: integer }
        disk:
          type: object
          nullable: true
          properties:
            path: { type: string }
            total_bytes: { type: integer }
            free_bytes: { type: integer }
            used_percent: { type: number }
        memory_usage:
          type: object
          additionalProperties: true
        jobs_total:
          type: integer
        jobs_running:
          type: integer
        jobs_queued:
          type: integer
        queue:
          $ref: '#/components/schemas/QueueHealth'
        node_version:
          type: string
    Job:
      type: object
      properties:
        job_id:
          type: string
        uid:
          type: string
        log_level:
          $ref: '#/components/schemas/LogLevel'
        un_id:
          type: string
        status:
          type: string
          enum: [queued, running, retrying, success, failed, validation_failed, cancelled, timeout]
        priority:
          type: integer
        attempts:
          type: integer
        max_attempts:
          type: integer
        backoff_ms:
          type: integer
        timeout_ms:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
          nullable: true
        finished_at:
          type: string
          format: date-time
          nullable: true
        result:
          $ref: '#/components/schemas/JobResult'
        error:
          $ref: '#/components/schemas/ErrorBody'
        callback_delivery:
          type: object
          nullable: true
          description: Состояние асинхронной доставки финального результата в 1С.
          properties:
            status:
              type: string
              enum: [pending, delivering, retrying, delivered, failed]
            url: { type: string }
            attempts: { type: integer }
            max_attempts: { type: integer }
            last_http_status: { type: integer, nullable: true }
            next_retry_at: { type: string, format: date-time, nullable: true }
            delivered_at: { type: string, format: date-time, nullable: true }
        execution:
          $ref: '#/components/schemas/Execution'
    JobResponse:
      type: object
      properties:
        job:
          $ref: '#/components/schemas/Job'
        idempotent:
          type: boolean
    JobLog:
      type: object
      properties:
        ts:
          type: string
          format: date-time
        level:
          type: string
          enum: [debug, info, warn, error]
        message:
          type: string
        details:
          type: object
          additionalProperties: true
    SystemConfig:
      type: object
      properties:
        max_parallel_jobs:
          type: integer
          example: 1
        default_job_timeout_ms:
          type: integer
          example: 30000
        retry_policy:
          $ref: '#/components/schemas/RetryPolicy'
security:
  - ApiKeyAuth: []
paths:
  /health:
    get:
      tags: [Сервис]
      summary: Проверить состояние сервиса
      security: []
      responses:
        "200":
          description: Сервис доступен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        "503":
          description: Сервис отвечает, но ещё не готов принимать задания
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /interpreter/actions:
    get:
      tags: [Интерпретатор]
      summary: Получить зарегистрированные действия
      responses:
        "200":
          description: Названия зарегистрированных действий
          content:
            application/json:
              schema:
                type: object
                properties:
                  actions:
                    type: array
                    items:
                      type: string
  /jobs:
    get:
      tags: [Задания]
      summary: Получить список заданий
      parameters:
        - in: query
          name: status
          description: Фильтр по статусу задания.
          schema:
            type: string
        - in: query
          name: limit
          description: Максимальное количество заданий в ответе.
          schema:
            type: integer
      responses:
        "200":
          description: Список заданий
    post:
      tags: [Задания]
      summary: Создать задание
      parameters:
        - in: header
          name: Idempotency-Key
          required: false
          schema:
            type: string
          description: Необязательный ключ идемпотентности для безопасного повторного создания задания.
          example: job-2026-06-08-001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobCreateRequest'
            examples:
              separatedContract:
                summary: Новый формат — параметры и текст сценария разделены
                value:
                  parameters:
                    uid: 1c-job-000042
                    priority: 30
                    timeout_ms: 120000
                    log_level: info
                    context:
                      delay_ms: 15000
                  script_text: '{"default_step_timeout_ms":60000,"steps":[{"action":"wait","params":{"duration_ms":"{{delay_ms}}"}}]}'
              stage4OneC:
                summary: Этап 4 — управляемая задержка и возврат результата в 1С
                value:
                  uid: 1c-stage4-delay-001
                  priority: 30
                  timeout_ms: 120000
                  retry_policy: { max_attempts: 2, backoff_ms: 1000 }
                  context:
                    delay_ms: 15000
                  callback:
                    url: http://1c-test.local:8080/script-factory/result
                    max_attempts: 5
                    backoff_ms: 1000
                    timeout_ms: 5000
                  script:
                    default_step_timeout_ms: 60000
                    steps:
                      - id: accept
                        title: Принять параметры из 1С
                        description: Фиксирует начало обработки задания.
                        action: noop
                        duration_ms: 100
                      - id: controlled-delay
                        title: Управляемая задержка
                        description: Ожидает указанное 1С время без внешних действий.
                        action: wait
                        params: { duration_ms: "{{delay_ms}}" }
                        timeout_ms: 60000
              browserReplay:
                summary: Нативный Chrome Recorder JSON — реальная отправка Yahoo → Gmail
                value:
                  uid: mail-stage3-00042
                  priority: 5
                  timeout_ms: 120000
                  context:
                    mail_to: 10sydneyfc@gmail.com
                    mail_subject: Проверка автоматизации
                    mail_body: Реальное письмо отправлено из seeergo@yahoo.com через Chromium.
                  script:
                    title: Реальная отправка Yahoo → Gmail
                    timeout: 15000
                    steps:
                      - title: Настроить окно Chromium
                        description: Устанавливает размер окна для демонстрации.
                        type: setViewport
                        width: 1400
                        height: 860
                        deviceScaleFactor: 1
                        isMobile: false
                        hasTouch: false
                        isLandscape: false
                      - title: Открыть Yahoo
                        description: Переходит на страницу входа Yahoo Mail.
                        type: navigate
                        url: "{{yahoo_mail_url}}"
                      - title: Ввести адрес Yahoo
                        description: Вводит адрес отправителя из конфигурации сервера.
                        type: change
                        selectors: [["#username"], ["input[name='username']"]]
                        value: "{{yahoo_login}}"
                      - title: Ввести пароль Yahoo
                        description: Использует YAHOO_MAIL_PASSWORD и маскирует значение в логах.
                        type: change
                        selectors: [["#login-passwd"], ["input[type='password']"]]
                        value: "{{yahoo_password}}"
                      - title: Указать получателя
                        description: Заполняет адрес Gmail из context.
                        type: change
                        selectors: [["[data-test-id='compose-to']"], ["#message-to-field"]]
                        value: "{{mail_to}}"
                      - type: waitForElement
                        selectors: [["#mail-compose"]]
                        visible: true
              success:
                summary: Успешная цепочка с подстановкой параметров
                value:
                  priority: 10
                  timeout_ms: 15000
                  retry_policy:
                    max_attempts: 2
                    backoff_ms: 500
                  script:
                    context:
                      current_ip: 192.168.1.10
                      root_dir: ./demo-data/incoming
                      loaded_dir: ./demo-data/loaded
                      receipt_dir: ./demo-data/downloads
                      prefixes: [FNS, SFR, ROSSTAT]
                    steps:
                      - action: check_ip
                        delay_ms: 250
                        params: { expected_ip: 192.168.1.10 }
                      - action: find_files
                        delay_ms: 250
                        params:
                          directory: "{{root_dir}}"
                          prefixes: "{{prefixes}}"
                      - action: launch_browser
                        delay_ms: 250
                      - action: navigate
                        delay_ms: 250
                        params: { url: https://online.sbis.ru }
                      - action: auth_ecp
                        delay_ms: 250
                      - action: upload_files
                        delay_ms: 250
                        params: { files: "{{found_files}}" }
                      - action: validate_report
                        delay_ms: 250
                        params: { valid: true }
                      - action: submit_if_valid
                        delay_ms: 250
                      - id: receipt
                        action: download_files
                        delay_ms: 250
                        params:
                          destination: "{{receipt_dir}}"
                          files:
                            - filename: submission-receipt.pdf
                              source_url: https://online.sbis.ru/reports/receipt.pdf
                              mime_type: application/pdf
                              size_bytes: 48231
                      - action: move_files
                        delay_ms: 250
                        params:
                          files: "{{found_files}}"
                          destination: "{{loaded_dir}}"
              fileNotFound:
                summary: Нормализованная ошибка FILE_NOT_FOUND
                value:
                  timeout_ms: 5000
                  retry_policy: { max_attempts: 1, backoff_ms: 200 }
                  script:
                    context:
                      root_dir: ./demo-data/empty
                      prefixes: [FNS]
                    steps:
                      - action: find_files
                        delay_ms: 300
                        params:
                          directory: "{{root_dir}}"
                          prefixes: "{{prefixes}}"
              retry:
                summary: Временный сбой СБИС Плагина и повторная попытка
                value:
                  timeout_ms: 8000
                  retry_policy: { max_attempts: 2, backoff_ms: 700 }
                  script:
                    steps:
                      - action: launch_browser
                        delay_ms: 300
                      - action: auth_ecp
                        delay_ms: 300
                        params: { fail_attempts: 1 }
                      - action: navigate
                        delay_ms: 300
                        params: { url: https://online.sbis.ru }
              timeout:
                summary: Превышение тайм-аута шага
                value:
                  timeout_ms: 3000
                  retry_policy: { max_attempts: 1, backoff_ms: 200 }
                  script:
                    steps:
                      - action: noop
                        timeout_ms: 250
                        delay_ms: 1200
      responses:
        "200":
          description: "Ранее созданное задание с тем же uid/Idempotency-Key (idempotent=true)"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobResponse'
        "201":
          description: Задание создано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobResponse'
        "400":
          description: Некорректный контракт задания или сценария
        "409":
          description: uid уже существует, но параметры или сценарий отличаются
  /jobs/by-uid/{uid}:
