services:
  script-factory:
    build: .
    ports:
      - "33001:33001"
      - "${NOVNC_BIND_HOST:-127.0.0.1}:${NOVNC_PORT:-33303}:33303"
    volumes:
      - ./data:/app/data
      - ./demo-data:/app/demo-data
      - ./work:/app/work
    environment:
      API_KEY: ${API_KEY:-dev-secret}
      UN_ID: ${UN_ID:?UN_ID must be set in .env}
      MAX_PARALLEL_JOBS: ${MAX_PARALLEL_JOBS:-2}
      DEFAULT_JOB_TIMEOUT_MS: ${DEFAULT_JOB_TIMEOUT_MS:-120000}
      WEB_LOGIN: ${WEB_LOGIN:?WEB_LOGIN must be set in .env}
      WEB_PASSWORD: ${WEB_PASSWORD:?WEB_PASSWORD must be set in .env}
      WEB_SESSION_TTL_HOURS: ${WEB_SESSION_TTL_HOURS:-12}
      WEB_COOKIE_SECURE: ${WEB_COOKIE_SECURE:-false}
      DEMO_MAIL_LOGIN: ${DEMO_MAIL_LOGIN:-demo.user}
      DEMO_MAIL_PASSWORD: ${DEMO_MAIL_PASSWORD:-demo-password}
      YAHOO_MAIL_URL: ${YAHOO_MAIL_URL:-https://login.yahoo.com/?src=ym&activity=header-signin}
      YAHOO_MAIL_LOGIN: ${YAHOO_MAIL_LOGIN:-seeergo@yahoo.com}
      YAHOO_MAIL_PASSWORD: ${YAHOO_MAIL_PASSWORD:-}
      YAHOO_MAIL_RECIPIENT: ${YAHOO_MAIL_RECIPIENT:-10sydneyfc@gmail.com}
      BROWSER_HEADLESS: ${BROWSER_HEADLESS:-false}
      BROWSER_STEP_DELAY_MS: ${BROWSER_STEP_DELAY_MS:-350}
      BROWSER_HOLD_OPEN_MS: ${BROWSER_HOLD_OPEN_MS:-5000}
      BROWSER_CAPTCHA_WAIT_MS: ${BROWSER_CAPTCHA_WAIT_MS:-120000}
      BROWSER_WINDOW_WIDTH: ${BROWSER_WINDOW_WIDTH:-1400}
      BROWSER_WINDOW_HEIGHT: ${BROWSER_WINDOW_HEIGHT:-860}
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium-browser
      NOVNC_ENABLED: ${NOVNC_ENABLED:-true}
      NOVNC_BIND_HOST: ${NOVNC_BIND_HOST:-127.0.0.1}
      NOVNC_INTERNAL_PORT: 33303
      NOVNC_PUBLIC_PORT: ${NOVNC_PORT:-33303}
      NOVNC_PUBLIC_URL: ${NOVNC_PUBLIC_URL:-}
      NOVNC_PASSWORD: ${NOVNC_PASSWORD:-}
      NOVNC_GEOMETRY: ${NOVNC_GEOMETRY:-1440x900x24}
      DISPLAY: ${NOVNC_DISPLAY:-:99}
      PORT: 33001
      HOST: 0.0.0.0
      DATA_DIR: /app/data
      FILESYSTEM_ALLOWED_ROOTS: /app/demo-data:/app/data:/app/work
      CALLBACK_AUTH_TOKEN: ${CALLBACK_AUTH_TOKEN:-}
      CALLBACK_ALLOWED_ORIGINS: ${CALLBACK_ALLOWED_ORIGINS:-}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:33001/health"]
      interval: 10s
      timeout: 3s
      retries: 5
  swagger-ui:
    image: swaggerapi/swagger-ui:v5.17.14
    ports:
      - "33002:8080"
    volumes:
      - ./swagger-initializer.js:/usr/share/nginx/html/swagger-initializer.js:ro
      - ./swagger-ru.js:/usr/share/nginx/html/swagger-ru.js:ro
      - ./openapi.yaml:/usr/share/nginx/html/spec/openapi.yaml:ro
