<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Вход в Фабрику сценариев">
    <title>Вход · Фабрика сценариев</title>
    <style>
      :root {
        font-family: Manrope, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #17211c;
        background: #f3f1ea;
      }

      * { box-sizing: border-box; }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at 20% 10%, rgba(18, 108, 77, .08), transparent 30rem),
          #f3f1ea;
      }

      button, input { font: inherit; }

      .login-card {
        width: min(100%, 390px);
        padding: 34px;
        border: 1px solid #d7d8cf;
        background: #fbfaf6;
        box-shadow: 0 22px 60px rgba(23, 33, 28, .09);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 44px;
        font-weight: 700;
        letter-spacing: -.03em;
      }

      .brand-mark {
        width: 29px;
        height: 29px;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 2px;
        padding: 5px;
        border: 1.5px solid #17211c;
        transform: rotate(-3deg);
      }

      .brand-mark i { display: block; align-self: end; background: #17211c; }
      .brand-mark i:nth-child(1) { height: 35%; }
      .brand-mark i:nth-child(2) { height: 100%; background: #ec6c3d; }
      .brand-mark i:nth-child(3) { height: 65%; }

      .eyebrow {
        margin: 0 0 10px;
        color: #ec6c3d;
        font: 600 10px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: .14em;
      }

      h1 {
        margin: 0;
        font-size: 31px;
        letter-spacing: -.045em;
      }

      .intro {
        margin: 10px 0 28px;
        color: #69736d;
        font-size: 13px;
        line-height: 1.6;
      }

      form { display: grid; gap: 17px; }
      label { display: grid; gap: 7px; font-size: 12px; font-weight: 600; }

      input {
        width: 100%;
        height: 46px;
        padding: 0 13px;
        border: 1px solid #c9ccc5;
        border-radius: 0;
        outline: 0;
        background: white;
        color: #17211c;
      }

      input:focus {
        border-color: #126c4d;
        box-shadow: 0 0 0 3px rgba(18, 108, 77, .1);
      }

      button {
        height: 48px;
        margin-top: 5px;
        padding: 0 17px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border: 1px solid #17211c;
        background: #17211c;
        color: white;
        cursor: pointer;
        font-size: 12px;
        font-weight: 700;
      }

      button span:last-child { color: #c9f04e; font-size: 18px; }
      button:hover { border-color: #126c4d; background: #126c4d; }
      button:disabled { opacity: .6; cursor: wait; }

      .error {
        min-height: 18px;
        margin: 0;
        color: #b84232;
        font-size: 12px;
      }

      @media (max-width: 440px) {
        body { padding: 12px; }
        .login-card { padding: 27px 23px; }
      }
    </style>
  </head>
  <body>
    <main class="login-card">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
        <span>Фабрика сценариев</span>
      </div>

      <p class="eyebrow">ЗАЩИЩЁННЫЙ ДОСТУП</p>
      <h1>Вход в систему</h1>
      <p class="intro">Введите логин и пароль, указанные в настройках приложения.</p>

      <form id="login-form">
        <label>
          Логин
          <input id="login" name="login" type="text" autocomplete="username" required autofocus>
        </label>
        <label>
          Пароль
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </label>
        <p class="error" id="error" role="alert" aria-live="polite"></p>
        <button id="submit" type="submit"><span>Войти</span><span>→</span></button>
      </form>
    </main>

    <script>
      const form = document.getElementById('login-form');
      const button = document.getElementById('submit');
      const errorMessage = document.getElementById('error');

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        errorMessage.textContent = '';
        button.disabled = true;

        try {
          const response = await fetch('/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              login: document.getElementById('login').value,
              password: document.getElementById('password').value
            })
          });
          const data = await response.json().catch(() => ({}));
          if (!response.ok) throw new Error(data.error?.message || 'Не удалось войти');

          const requestedPath = new URLSearchParams(window.location.search).get('next');
          const nextPath = requestedPath?.startsWith('/') && !requestedPath.startsWith('//')
            ? requestedPath
            : '/';
          window.location.replace(nextPath);
        } catch (error) {
          errorMessage.textContent = error.message;
          document.getElementById('password').select();
        } finally {
          button.disabled = false;
        }
      });
    </script>
  </body>
</html>
